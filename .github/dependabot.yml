version: 2

# Jedno PR týdně a nejvýš pár otevřených naráz — při pěti hodinách týdně
# je zaplavená schránka horší než zastaralá závislost, protože ji přestaneš
# číst úplně.
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"

  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      # Microsoft vydává celý .NET najednou; jedno PR místo deseti.
      dotnet:
        patterns:
          - "Microsoft.*"
          - "System.*"

  - package-ecosystem: npm
    directory: "/web"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "web"
    groups:
      # Next a jeho typy se vydávají spolu; jedno PR místo tří.
      next:
        patterns:
          - "next"
          - "eslint-config-next"
          - "@next/*"
      typy:
        patterns:
          - "@types/*"

  - package-ecosystem: npm
    directory: "/app"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "app"
    ignore:
      # Balíčky Expo drží číslo řady podle SDK a jejich peer závislosti
      # chtějí celou tu řadu. Major u jednoho z nich vyrobí smíšený strom,
      # který CI nezachytí — appka se jen typově kontroluje, nestaví
      # a nespouští. Zvedají se s celým SDK, ne zvlášť.
      #
      # Dřív tu stálo jen `expo` a `expo-router`, a 19. 10. 2026 to
      # nestačilo: Dependabot poslal tři PR, co zvedaly
      # `expo-secure-store`, `expo-crypto` a `expo-status-bar` na 58.x,
      # zatímco `expo` zůstávalo na 57 (PR #329, #330, #331 — zavřené).
      # Zrovna ty první dva přitom nesou přihlášení: secure-store drží
      # token, crypto dělá PKCE. Vzor proto platí na všechny.
      - dependency-name: "expo*"
        update-types: ["version-update:semver-major"]
      # <b>React a React Native drží SDK taky</b>, a tady to 20. 10. 2026
      # stálo tři další červené PR (#345, #346, #347 — zavřené): bumpy
      # `react-native` 0.86.3 → 0.88.0, `react-dom` 19.2.3 → 19.3.1
      # a `react` shodily rovnou `npm install` na peer závislostech
      # (`expo@"~57.0.30" from the root project` a dvacítka `@expo/*`).
      #
      # Minor je u nich stejně nebezpečný jako major: `react-native` je
      # na nule, takže 0.86 → 0.88 je formálně minor, ale fakticky řada
      # vedle — a předchozí pravidlo na major ho proto pustilo. Patch
      # zůstává povolený; ten SDK snese.
      - dependency-name: "react-native"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      # <b>React drží SDK na přesné verzi, takže ani patch neprojde.</b>
      # Změřeno 20. 10. 2026: `npx expo install --check` u SDK 57 jmenuje
      # `react@19.2.3` a `react-dom@19.2.3` — ne „19.2.x", ale tu jednu.
      # Dependabot poslal bumpy na 19.2.9 ve dvou PR (#350, #351), takže
      # `react-dom` navíc shodil `npm install`: chce `react` téže verze
      # a ten zůstával starý. Zvednou se s celým SDK.
      - dependency-name: "react"
      - dependency-name: "react-dom"
      # `react-native-screens` je totéž: SDK 57 chce `~4.26.0`, Dependabot
      # nabízel 4.30.0 (#352). Patch v rámci řady zůstává povolený.
      - dependency-name: "react-native-screens"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      # Typy mají sledovat runtime — totéž pravidlo jako u `@types/node`
      # ve webu (plán, *Závislosti*). `@types/react` pro 19.3 by popisoval
      # React, který v appce není, takže by kontrola schválila kód, co za
      # běhu spadne.
      - dependency-name: "@types/react"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "docker"
