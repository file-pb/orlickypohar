version: 2

# Jedno PR týdně a nejvýš pár otevřených naráz — při pěti hodinách týdně
# je zaplavená schránka horší než zastaralá závislost, protože ji přestaneš
# číst úplně.
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"

  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      # Microsoft vydává celý .NET najednou; jedno PR místo deseti.
      dotnet:
        patterns:
          - "Microsoft.*"
          - "System.*"

  - package-ecosystem: npm
    directory: "/web"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "web"
    groups:
      # Next a jeho typy se vydávají spolu; jedno PR místo tří.
      next:
        patterns:
          - "next"
          - "eslint-config-next"
          - "@next/*"
      typy:
        patterns:
          - "@types/*"

  - package-ecosystem: npm
    directory: "/app"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "app"
    ignore:
      # <b>Stopa k tomu, co se tím tlumením odkládá, je v `docs/PLAN.md`,
      # oddíl *Tlumené majory v appce, a co tím odkládáme*.</b> Stojí tam,
      # co se tlumí, proč, co se tím odkládá (přechod na Expo 58) a čtyři
      # spouště k přehodnocení. Schválně text v plánu, ne otevřené
      # upozornění u Dependabota: to se 7. 11. 2026 zavřelo overridem,
      # aniž by se odložená věc vyřešila, a připomínka s ním zmizela.
      #
      # Balíčky Expo drží číslo řady podle SDK a jejich peer závislosti
      # chtějí celou tu řadu. Major u jednoho z nich vyrobí smíšený strom,
      # který CI nezachytí — appka se jen typově kontroluje, nestaví
      # a nespouští. Zvedají se s celým SDK, ne zvlášť.
      #
      # Dřív tu stálo jen `expo` a `expo-router`, a 19. 10. 2026 to
      # nestačilo: Dependabot poslal tři PR, co zvedaly
      # `expo-secure-store`, `expo-crypto` a `expo-status-bar` na 58.x,
      # zatímco `expo` zůstávalo na 57 (PR #329, #330, #331 — zavřené).
      # Zrovna ty první dva přitom nesou přihlášení: secure-store drží
      # token, crypto dělá PKCE. Vzor proto platí na všechny.
      - dependency-name: "expo*"
        update-types: ["version-update:semver-major"]
      # <b>React a React Native drží SDK taky</b>, a tady to 20. 10. 2026
      # stálo tři další červené PR (#345, #346, #347 — zavřené): bumpy
      # `react-native` 0.86.3 → 0.88.0, `react-dom` 19.2.3 → 19.3.1
      # a `react` shodily rovnou `npm install` na peer závislostech
      # (`expo@"~57.0.30" from the root project` a dvacítka `@expo/*`).
      #
      # Minor je u nich stejně nebezpečný jako major: `react-native` je
      # na nule, takže 0.86 → 0.88 je formálně minor, ale fakticky řada
      # vedle — a předchozí pravidlo na major ho proto pustilo. Patch
      # zůstává povolený; ten SDK snese.
      - dependency-name: "react-native"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      # <b>React drží SDK na přesné verzi, takže ani patch neprojde.</b>
      # Změřeno 20. 10. 2026: `npx expo install --check` u SDK 57 jmenuje
      # `react@19.2.3` a `react-dom@19.2.3` — ne „19.2.x", ale tu jednu.
      # Dependabot poslal bumpy na 19.2.9 ve dvou PR (#350, #351), takže
      # `react-dom` navíc shodil `npm install`: chce `react` téže verze
      # a ten zůstával starý. Zvednou se s celým SDK.
      - dependency-name: "react"
      - dependency-name: "react-dom"
      # `react-native-screens` je totéž: SDK 57 chce `~4.26.0`, Dependabot
      # nabízel 4.30.0 (#352). Patch v rámci řady zůstává povolený.
      - dependency-name: "react-native-screens"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      # Typy mají sledovat runtime — totéž pravidlo jako u `@types/node`
      # ve webu (plán, *Závislosti*). `@types/react` pro 19.3 by popisoval
      # React, který v appce není, takže by kontrola schválila kód, co za
      # běhu spadne.
      - dependency-name: "@types/react"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "docker"
    ignore:
      # **Číslo řady .NET drží `TargetFramework`, ne ta image.** Je to týž
      # případ jako `expo*` výš: verze stojí na třech místech, která musí
      # souhlasit — `net10.0` v obou csproj, `sdk:` na prvním řádku
      # Dockerfile a `aspnet:` na osmnáctém — a Dependabot vidí jen ty dva
      # poslední. Major bump proto změní dvě ze tří a vyrobí kontejner,
      # který aplikaci nespustí.
      #
      # Změřeno 13. 11. 2026, třemi pokusy proti sobě (hostfxr je stejný
      # napříč platformami, tak to šlo o řadu níž, lokálně):
      #
      # | aplikace | runtime | nastavení | výsledek |
      # |---|---|---|---|
      # | `net9.0` | 10.0.14 | výchozí | `You must install or update .NET` |
      # | `net10.0` | 10.0.14 | výchozí | běží |
      # | `net9.0` | 10.0.14 | `DOTNET_ROLL_FORWARD=Major` | běží |
      #
      # Druhý řádek říká, že prostředí bylo zdravé; třetí, že příčinou je
      # právě politika roll-forward a nic jiného. Projekt ji nikde nemění
      # (žádný `RollForward` v csproj, žádný `runtimeconfig.template.json`,
      # žádná `DOTNET_*` v compose), takže platí výchozí.
      #
      # **SDK samo by přitom prošlo** — SDK 10 postaví `net9.0` bez
      # varování, takže bump build stage nic nerozbije. Pravidlo přesto
      # platí na obě image: rozdělovat je znamená pamatovat si, která
      # z těch dvou je ta nebezpečná.
      #
      # <b>A CI to neodhalí.</b> PR #538 (`aspnet` 10 → 11) i #539 (`sdk`)
      # byly celé zelené — `build` pass, `integrace` pass — protože se
      # image na pull requestu jen staví a nikdy nespouští. Zelená tady
      # o spustitelnosti kontejneru neříká nic; to spraví až smoke test
      # v build jobu, který je samostatně.
      #
      # Přechod na .NET 11 tím není zakázaný, jen přestává chodit robotem:
      # zvedne se `TargetFramework` a Dockerfile pojede s ním. Patch
      # a minor (`10.0` → `10.1`) chodí dál a to jsou právě bezpečnostní
      # záplaty base image.
      # <b>Jméno je bez registru.</b> `mcr.microsoft.com/dotnet/*` tu stálo
      # první a nedělalo nic: Dependabot si závislost vede pod jménem
      # z `updated-dependencies` ve vlastním commitu, a tam je
      # `dependency-name: dotnet/aspnet` — bez `mcr.microsoft.com/`.
      # Pravidlo tedy neodpovídalo ničemu a vypadalo přitom správně.
      - dependency-name: "dotnet/*"
        update-types: ["version-update:semver-major"]
