version: 2

# Jedno PR týdně a nejvýš pár otevřených naráz — při pěti hodinách týdně
# je zaplavená schránka horší než zastaralá závislost, protože ji přestaneš
# číst úplně.
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"

  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      # Microsoft vydává celý .NET najednou; jedno PR místo deseti.
      dotnet:
        patterns:
          - "Microsoft.*"
          - "System.*"
    ignore:
      # ImageSharp 4 chce při buildu licenční klíč, i zdarma. Řada 3.1 má
      # tutéž licenci bez klíče; přechod je rozhodnutí, ne týdenní PR.
      - dependency-name: "SixLabors.ImageSharp"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "docker"
