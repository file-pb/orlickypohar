name: build-deploy

on:
  push:
    branches: [main]
  # Na pull requestu se testuje a zkusmo staví image, ale NIC se nikam
  # nepushuje ani nenasazuje. Recenzent tak vidí, jestli změna projde,
  # dřív než se dotkne serveru.
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      obnova:
        description: >-
          Nasadit, i když se nedá přečíst, co na produkci běží. Výslovný režim
          obnovy — bez něj se při nečitelné verzi nasazení zastaví, protože
          výpadek /verze by jinak obešel ochranu proti návratu do minulosti.
        type: boolean
        default: false
      nahrat_znovu:
        description: >-
          Nahrát do Play poslední dokončený balíček, i když se nativní otisk
          nezměnil. Cesta ven pro případ, kdy se build povedl a nahrání
          spadlo: otisk už pak sedí, takže samo se to podruhé nezkusí.
        type: boolean
        default: false

env:
  # Veřejné adresy obou služeb. Proměnná repozitáře je přebije, kdyby se
  # někdy přestěhovaly; výchozí hodnota je tu proto, aby ověření po nasazení
  # fungovalo i bez další konfigurace.
  API_URL: ${{ vars.API_URL || 'https://orlickypohar-api.klihovka.cz' }}
  WEB_URL: ${{ vars.WEB_URL || 'https://orlickypohar.klihovka.cz' }}
  IMAGE: ghcr.io/${{ github.repository }}
  IMAGE_WEB: ghcr.io/${{ github.repository }}-web
  IMAGE_LANDSAT: ghcr.io/${{ github.repository }}-landsat
  IMAGE_CACHE: ghcr.io/${{ github.repository }}-cache
  # Datum nehybné značky ve zrcadle (`.github/workflows/zrcadlo.yml`).
  # Zrcadlo vyrábí u každého obrazu značku pohyblivou i datovanou; bere se
  # **datovaná**, aby se tentýž commit postavil vždycky stejně. Když měsíční
  # přesyn ohlásí posun základního obrazu, přepíše se datum tady a ve třech
  # Dockerfilech — to je ta jediná změna, kterou přesyn stojí, a je na ní
  # vidět, kdy se základ posunul (platform/docs/KVOTY.md, nález K7).
  ZRCADLO_ZNACKA: '2026-11'

# Jedna rozdělaná sada běhů na větev. Druhý push do téže větve ten předchozí
# **zruší** — starší výsledek už nikoho nezajímá a minuty Actions jsou kvóta
# na účet, která se 10. 10. 2026 ukázala jako nejbližší zeď: 4 707 minut za
# třicet dní proti hladině 2 000 (platform/docs/KVOTY.md, nález K4). Polovina
# těch běhů byla zbytečná — na pull request se tlačí opravy po sobě a staví
# se každá.
#
# Na `main` se **neruší nic**: tam je každý běh nasazení a zrušený běh by
# znamenal verzi, která se na produkci nikdy nedostala.
#
# Tahle skupina je na workflow, zatímco job `nasazeni` má svoji vlastní
# (`nasazeni-produkce`). Nekolidují: workflow-level skupina řeší „jeden
# rozdělaný běh na větev", ta u jobu „jedno nasazení naráz přes všechny
# cesty do produkce, včetně ručního spuštění". Obě musí zůstat.
concurrency:
  group: build-deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Externí akce jsou připnuté na otisk commitu, ne na značku. Značka se dá
# přesunout, takže kdo ovládne repozitář akce, spustí si kód v tomhle CI —
# a to má právo zápisu do registru. Otisky aktualizuje Dependabot.
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      # Balíčky NuGetu z cache. Dva důvody a oba se 9. 10. 2026 ukázaly:
      #
      # 1. `api.nuget.org` nemá zveřejněný limit, ale škrtí po IP — a tu
      #    runner GitHubu **sdílí s cizími projekty**. Jeden build toho dne
      #    spadl na `Connection reset by peer`. Je to tatáž zeď jako limit
      #    Docker Hubu, jen o vrstvu dál a s horší hláškou: nevrací čistou
      #    429 s vysvětlením, ale resetnuté spojení, takže to vypadá na
      #    chybu sítě a hledá se to špatně.
      # 2. Stahování se platí minutami, a ty jsou kvóta na účet.
      #
      # Klíč je z `*.csproj`, protože `packages.lock.json` tu není. Je to
      # hrubší než lockfile (změna verze balíčku bez změny csproj se
      # nepozná), zato to nevyžaduje přepnout celé repo na lockfiles.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # Jen testy bez Dockeru: doběhnou za vteřiny a hlídají datový kontrakt,
      # tedy to nejdražší na pozdější otočení. Integrační testy běží ve
      # vedlejší úloze, která nasazení schválně neblokuje.
      #
      # Vylučujeme integrační testy značkou, ne shodou na jménu třídy —
      # nový test se tak do řetězu dostane sám a filtr se nemusí opravovat.
      - name: Testy bez Dockeru
        run: dotnet test -c Release --nologo --filter "Category!=Integracni"
        # Licence ImageSharpu: `dotnet test -c Release` ji vyžaduje stejně jako
        # publish (v Debugu je to jen varování, proto to lokálně neselže).
        env:
          SIXLABORS_LICENSE_KEY: ${{ secrets.SIXLABORS_LICENSE_KEY }}

      # Přihlášení stojí **nad** vším, co staví image, a běží i na pull
      # requestu. Základní obrazy se berou z našeho zrcadla v GHCR
      # (`.github/workflows/zrcadlo.yml`) a to je po pushi soukromé —
      # anonymní dotaz na manifest vrací 403. Dřív se tenhle krok na pull
      # requestu přeskakoval, protože se přihlášení potřebovalo jen
      # k pushi; teď je potřeba i ke čtení. Co se kam pushuje, hlídá
      # `push:` u build-push-action, ne tohle.
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pravidla mikrocache před webem proti falešnému webu: hlavně že se
      # stránka přihlášeného nikdy nedostane do cache. Když to selže,
      # nenasadí se nic — chyba tady by ukazovala cizí stránky.
      - name: Test cache
        run: deploy/cache/test/test.sh

      # Barevné tokeny: shoda webu s kopií v appce a kontrast spočítaný
      # z těch tokenů. Je to **krok v tomhle jobu, ne vlastní úloha**:
      # minuty Actions jsou nejbližší zeď hračkárny (platform/docs/KVOTY.md,
      # nález K4) a nový job by platil celý svůj start kvůli pár desítkám
      # milisekund počítání. Běží před buildem schválně — rozchod barev se
      # pozná dřív, než se postaví čtyři image.
      - name: Kontrola barevných tokenů
        run: python3 tools/kontrola-tokenu.py

      # Velikost klepacích míst v appce. Stejný důvod pro krok místo úlohy
      # jako u tokenů výš. Přibyla 6. 11. 2026 **až s opravou** těch míst:
      # do té doby jich bylo 34 z 52 pod mezí a kontrola by shazovala každý
      # běh, což je horší než žádná — vypne se a zůstane komentář.
      - name: Kontrola velikosti klepacích míst
        run: python3 tools/kontrola-dotyku.py

      # Znění souhlasu závodníka drží C# i JSX — právní text ve dvou
      # kopiích. Stejný důvod pro krok místo úlohy jako u dvou kontrol výš.
      # Přibylo 18. 11. 2026 s verzí 3 (podmínky účasti): tehdy se ukázalo,
      # že změna v `Souhlas.cs` sama nezmění, co má člověk před očima.
      - name: Kontrola znění souhlasu
        run: python3 tools/kontrola-souhlasu.py

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      # amd64 je výchozí cíl kvůli kompatibilitě s cizími binárkami (SDK ke kamerám,
      # nástroje výrobců, starší image). arm64 přidej, až budeš mít vedlejší ARM stroj na výpočty.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          # Na pull requestu se image jen postaví, aby se ověřil Dockerfile.
          # Do registru jde teprve po sloučení do main.
          push: ${{ github.event_name != 'pull_request' }}
          # Na pull requestu navíc do místního démona, aby ji šlo spustit
          # (krok „Nastartuje se API image doopravdy?" hned pod buildy).
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Commit do image, ať po nasazení jde ověřit, co doopravdy běží.
          build-args: |
            VERZE=${{ github.sha }}
          # ImageSharp 4 chce licenci při publish. Jako secret, ne build-arg.
          secrets: |
            sixlabors=${{ secrets.SIXLABORS_LICENSE_KEY }}
          # `scope` musí mít **každý** build vlastní. Bez něj jde všechno do
          # klíče `buildkit` a je to zdokumentované chování buildx: *„if you
          # build multiple images, each build will overwrite the cache of the
          # previous."* Tady se takhle čtyři obrazy přepisovaly dokola —
          # index `buildkit-1-f921bd05` pro `main` měl 10. 10. 2026 verzi
          # **#1151** při 37 živých záznamech, tedy přepsaný tisíckrát.
          # Platilo se 10,6 GB blobů (limit je 10 GB **na repozitář**, takže
          # se cache trvale vytloukala) a kupovala se z nich cache pro
          # poslední ze čtyř obrazů. Nález K2 v platform/docs/KVOTY.md.
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      # Web je druhá image, ne druhý repozitář. Staví se vždycky, i když se
      # měnilo jen API — filtrování podle cest by ušetřilo minutu buildu
      # a vyměnilo ji za riziko, že se obě image rozejdou.
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta-web
        with:
          images: ${{ env.IMAGE_WEB }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./web
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          build-args: |
            VERZE=${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      # Třetí image: plánovaná úloha s teplotou hladiny ze satelitu.
      # Build zároveň ověří, že kola rasterio sedí na Python v image.
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta-landsat
        with:
          images: ${{ env.IMAGE_LANDSAT }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./jobs/landsat
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-landsat.outputs.tags }}
          labels: ${{ steps.meta-landsat.outputs.labels }}
          # Commit do image: u úlohy bez HTTP se jinak zvenčí zjistit nedá.
          build-args: |
            VERZE=${{ github.sha }}
          cache-from: type=gha,scope=landsat
          cache-to: type=gha,mode=max,scope=landsat

      # Čtvrtá image: nginx s mikrocache před webem (deploy/cache/).
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta-cache
        with:
          images: ${{ env.IMAGE_CACHE }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./deploy/cache
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-cache.outputs.tags }}
          labels: ${{ steps.meta-cache.outputs.labels }}
          # Commit do image: konfigurace mikrocache je její obsah.
          build-args: |
            VERZE=${{ github.sha }}
          cache-from: type=gha,scope=cache
          cache-to: type=gha,mode=max,scope=cache

      # <b>Postavená image se taky spustí.</b> Do 16. 11. 2026 se u pull
      # requestu jen postavila a zahodila, takže zelená neříkala nic o tom,
      # jestli kontejner vůbec naběhne.
      #
      # Změřeno na PR #538 (`aspnet` z `10.0-alpine` na `11.0-alpine`):
      # `build` pass, `integrace` pass, celé zelené — a runtime o řadu výš
      # přitom aplikaci cílenou na `net10.0` nespustí vůbec. Není to
      # o .NET: stejně tiše projde chybějící `icu-libs`, špatný `USER`,
      # překlep v `ENTRYPOINT` i základ, který se přejmenoval. Všechno se
      # to pozná až po výměně produkce.
      #
      # Krok, ne vlastní úloha — stejný důvod jako u kontroly tokenů výš:
      # nový job platí celý svůj start kvůli dvěma minutám běhu.
      #
      # **Jen na pull requestu.** Tam se nikam nepushuje, takže image může
      # do místního démona (`load`). Na `main` se pushuje do registru
      # a `load` by k tomu byl druhý výstup; jestli to buildx snese, jsem
      # nezkoušel a tenhle krok není místo, kde to zkoušet. Do `main` se
      # chodí přes pull request, takže hrana je úzká — a po nasazení ji
      # kryje `Ověřit, co doopravdy běží`, byť až po výměně produkce.
      #
      # Databáze musí být: migrace se pouští **před** `app.RunAsync()`
      # (Program.cs), takže bez ní se server nedostane k poslouchání
      # a `/health` by nic neznamenal. Čte se `/health/ready`, ne
      # `/health` — ten je liveness s `Predicate = _ => false` a vrátil by
      # Healthy i kdyby schéma neodpovídalo.
      - name: Nastartuje se API image doopravdy?
        if: ${{ github.event_name == 'pull_request' }}
        env:
          TAGY: ${{ steps.meta.outputs.tags }}
          POSTGRES: ghcr.io/${{ github.repository }}/zrcadlo/postgres:17-alpine-${{ env.ZRCADLO_ZNACKA }}
        run: |
          set -euo pipefail
          obraz=$(printf '%s\n' "$TAGY" | head -1)
          echo "::notice::Zkouší se $obraz"

          docker network create smoke >/dev/null
          docker run -d --name smoke-db --network smoke \
            -e POSTGRES_USER=smoke -e POSTGRES_PASSWORD=smoke -e POSTGRES_DB=pohar \
            "$POSTGRES" >/dev/null

          for _ in $(seq 1 30); do
            docker exec smoke-db pg_isready -U smoke -d pohar >/dev/null 2>&1 && break
            sleep 1
          done
          docker exec smoke-db pg_isready -U smoke -d pohar

          # Tajemství souborem, ne proměnnou prostředí — tak to čte
          # `AddKeyPerFile("/run/secrets")` i na produkci.
          mkdir -p /tmp/smoke/secrets
          printf '%s' 'Host=smoke-db;Port=5432;Database=pohar;Username=smoke;Password=smoke' \
            > /tmp/smoke/secrets/ConnectionStrings__Postgres

          docker run -d --name smoke-api --network smoke \
            -v /tmp/smoke/secrets:/run/secrets:ro -p 8080:8080 "$obraz" >/dev/null

          hotovo=ne
          for _ in $(seq 1 40); do
            if curl -fsS --max-time 3 http://127.0.0.1:8080/health/ready >/dev/null 2>&1; then
              hotovo=ano
              break
            fi
            # Spadlý kontejner nemá smysl čekat do konce.
            if [ "$(docker inspect -f '{{.State.Running}}' smoke-api)" != true ]; then
              break
            fi
            sleep 3
          done

          if [ "$hotovo" != ano ]; then
            echo "::error::API image nenaběhla: /health/ready neodpovědělo."
            echo "=== log kontejneru ==="
            docker logs smoke-api 2>&1 | tail -40
            exit 1
          fi
          echo "::notice::/health/ready odpovědělo, kontejner běží."


  # Testy proti reálnému PostgreSQL přes Testcontainers. Běží VEDLE buildu,
  # ale nasazení na ně od 6. 10. 2026 ČEKÁ (oponentura): když se produkce
  # změní dřív, než je výsledek, znamená červená integrace už nasazenou
  # vadnou verzi — a přesně to se tu jednou stalo.
  #
  # Doma se pustit nedají — Docker Hub je z pracovního stroje nedostupný,
  # takže tohle je jediné místo, kde se import ověří proti databázi.
  # Appka se do žádného image nebalí, takže by se bez téhle úlohy s modelem
  # rozešla potichu: chyba překladu se nikde nespustí a pozná se až na
  # telefonu. Přesně to se stalo se stavem `Potvrzeny` — v API přibyl,
  # ve slovníku appky chyběl, a web tutéž chybu chytil jen proto, že
  # `next build` typy kontroluje.
  appka:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # `cache: 'npm'` je cache balíčků, ne Node.js — `setup-node` si ji
      # obstará sám z `package-lock.json`. Důvod je stejný jako u NuGetu:
      # `registry.npmjs.org` škrtí po IP, a tu runner sdílí s cizími
      # projekty (platform/docs/KVOTY.md, nález K3). Cesta k lockfilu se
      # musí napsat, protože appka není v korzeni repozitáře.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      # Pravidla průvodce stavbou prvku jsou v obou klientech jako kopie
      # jednoho zdroje (`packages/stavba/`) — workspace se symlinky by
      # musel obsloužit Next i Metro, viz komentář v tom skriptu. Kopii
      # drží poctivou tahle kontrola, ne dobrá vůle: bez ní se dvě kopie
      # rozejdou do měsíce a pozná se to až na vodě. Nepotřebuje žádné
      # závislosti, takže stojí před instalací.
      - name: Sedí kopie sdílených pravidel?
        run: ./packages/stavba/rozkopiruj.sh --zkouska

      - name: Závislosti appky
        run: npm ci
        working-directory: app

      - name: Typy appky proti API
        run: npx tsc --noEmit
        working-directory: app

      # Záznam trasy je jediná část appky, která smí přijít o data, když ji
      # systém zabije — testy hlídají právě to a žádnou další závislost
      # nepotřebují (SQLite dělá vestavěné `node:sqlite`).
      - name: Testy záznamu trasy
        run: npm run testy
        working-directory: app

      # <b>Lint appky neběží — padne, než něco zkontroluje.</b> Tenhle krok
      # ho pouští právě proto: ne aby hlídal kód, ale aby bylo vidět, až
      # ten pád přestane. Měřeno 16. 11. 2026, čtyři kombinace proti sobě
      # (`npm install --no-save`, vždycky čistý `npm ci` zpátky):
      #
      # | typescript | eslint | eslint-config-expo | `npm run lint` |
      # |---|---|---|---|
      # | 6.0.3 | 9.39.5 | 57.0.2 | **projde** (340 nálezů) |
      # | 6.0.3 | 10.13.0 | 58.0.4 | padá: `getFilename is not a function` |
      # | 7.0.2 | 9.39.5 | 57.0.2 | padá: `reading 'Intrinsic'` |
      # | 7.0.2 | 10.13.0 | 57.0.2 i 58.0.4 | padá: totéž |
      #
      # První řádek říká, že lint sám funkční je; druhý a třetí dělí dva
      # nezávislé blokátory, každý z jednoho majoru v `app/package.json`:
      # ESLint 10 (#518) rozbije `eslint-plugin-react`, který si
      # `eslint-config-expo` přibaluje a my ho nepřebijeme, a TypeScript 7
      # rozbije `ts-api-utils` 2.5.0 (TS 7 umí teprve 3.0.0-rc.1).
      #
      # <b>Proč to nikdo nepoznal:</b> `eslint` neběžel v CI vůbec — ani
      # v appce, ani ve webu. Skript `lint` v `package.json` byl, nikdo ho
      # nepouštěl, a Dependabot zvedal jeho závislosti dál. Tenhle krok je
      # právě ta chybějící věta: `zpráva, ne vrátný` (`continue-on-error`,
      # stejně jako krok o ruční instalaci pod ním), protože mrtvý lint
      # nemá co brzdit nasazení — ale až obživne, chceme to vědět hned.
      #
      # Podrobně v `docs/PLAN.md`, oddíl *Lint appky je mrtvý a nikdo si
      # toho nevšiml*.
      - name: Jde už lint appky?
        id: lint
        continue-on-error: true
        working-directory: app
        run: |
          set -uo pipefail
          vystup=$(npm run lint 2>&1 || true)

          if ! printf '%s' "$vystup" | grep -qF 'Oops! Something went wrong'; then
            echo "::warning::Lint appky se rozběhl. Zapni ho do CI a zahoď tenhle krok."
            {
              echo "### Lint appky už nepadá"
              echo ""
              echo "Pouštěl se jen jako past na tohle. Teď projde, takže má smysl"
              echo "ho zapnout naostro: nahradit tenhle krok za \`npm run lint\`"
              echo "a smazat oddíl *Lint appky je mrtvý a nikdo si toho nevšiml*"
              echo "z \`docs/PLAN.md\`."
              echo ""
              echo '```'
              printf '%s\n' "$vystup" | tail -30
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if printf '%s' "$vystup" | grep -qF "reading 'Intrinsic'"; then
            echo "::notice::Lint appky pořád padá na ts-api-utils vs TypeScript 7. Čeká se na ts-api-utils 3.0."
            exit 0
          fi

          if printf '%s' "$vystup" | grep -qF 'getFilename is not a function'; then
            echo "::notice::Lint appky pořád padá na eslint-plugin-react vs ESLint 10 (uvnitř eslint-config-expo)."
            exit 0
          fi

          # <b>Třetí možnost je ta nebezpečná:</b> padá dál, ale jinak než
          # na co máme záznam. Pak je ten záznam zastaralý a notice by ho
          # jen potvrdila.
          echo "::warning::Lint appky padá na něčem jiném, než co je zapsané v PLAN.md — záznam je zastaralý."
          {
            echo "### Lint appky padá novou chybou"
            echo ""
            echo "Ani \`reading 'Intrinsic'\`, ani \`getFilename is not a function\`."
            echo "Oddíl *Lint appky je mrtvý a nikdo si toho nevšiml* v \`docs/PLAN.md\`"
            echo "tedy popisuje něco, co už neplatí."
            echo ""
            echo '```'
            printf '%s\n' "$vystup" | tail -30
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # <b>Žádá tahle verze ruční instalaci?</b> (Filip, 28. 10. 2026:
      # *„pokud bude potreba apku znovu instalovat, tak to potrebuji
      # rict"*.) Aktualizace přes `expo-updates` vezou jen JavaScript;
      # nativní změna posune `runtimeVersion` a update se starému APK
      # **nedoručí** — a nic přitom neselže. Appka v telefonu se prostě
      # přestane aktualizovat a nikdo to nepozná.
      #
      # Hlídá se i adresa v compose: mezi 8. 9. a 28. 10. 2026 nabízela
      # stránka `/appka` sedm týdnů starý build, protože se po buildu
      # zapomněla přepsat.
      #
      # <b>Nebrzdí nasazení</b> (`continue-on-error`): `nasazeni` čeká na
      # tuhle úlohu, a nativní změna v appce nemá co zdržovat web s API.
      # Je to zpráva, ne vrátný.
      - name: Žádá appka ruční instalaci?
        id: instalace
        continue-on-error: true
        working-directory: app
        run: |
          otisk=$(npx expo-updates fingerprint:generate --platform android \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['hash'])")
          vydane=$(python3 -c "import json; print(json.load(open('vydane-apk.json'))['runtimeVersion'])")
          url=$(python3 -c "import json; print(json.load(open('vydane-apk.json'))['url'])")
          kdy=$(python3 -c "import json; print(json.load(open('vydane-apk.json'))['vydano'])")

          chyba=0

          verze=$(python3 -c "import json; print(json.load(open('vydane-apk.json'))['versionCode'])")

          # Verze a datum na stránce /appka. Jsou v compose vedle adresy
          # (obraz webu se staví jen z `web/`, tenhle soubor v něm není),
          # takže se stejně jako adresa dají zapomenout — a stránka by pak
          # tvrdila o nabízeném APK něco, co neplatí.
          if ! grep -qF "APK_VERZE: \"$verze\"" ../deploy/docker-compose.yml \
            || ! grep -qF "APK_VYDANO: \"$kdy\"" ../deploy/docker-compose.yml; then
            echo "::warning::Verze nebo datum APK v docker-compose.yml nesedí s vydane-apk.json."
            {
              echo "### Stránka /appka píše o jiném buildu, než který rozdává"
              echo ""
              echo "V \`app/vydane-apk.json\` je build \`$verze\` z \`$kdy\`;"
              echo "\`deploy/docker-compose.yml\` má v \`APK_VERZE\`/\`APK_VYDANO\` jiné údaje."
            } >> "$GITHUB_STEP_SUMMARY"
            chyba=1
          fi

          if ! grep -qF "$url" ../deploy/docker-compose.yml; then
            echo "::warning::Adresa APK ve vydane-apk.json nesedí s APK_URL v docker-compose.yml."
            {
              echo "### Stránka /appka nabízí jiné APK, než které je zapsané"
              echo ""
              echo "V \`app/vydane-apk.json\` je \`$url\`, ale \`deploy/docker-compose.yml\` má jinou."
              echo "Jedno z nich je zastaralé — a stahovat půjde dál, takže si toho nikdo nevšimne."
            } >> "$GITHUB_STEP_SUMMARY"
            chyba=1
          fi

          if [ "$otisk" != "$vydane" ]; then
            echo "::warning::Appku je potřeba znovu postavit a ručně nainstalovat — změnila se nativní část."
            {
              echo "### ⚠️ Appku bude potřeba znovu nainstalovat"
              echo ""
              echo "Změnila se nativní část appky, takže **aktualizace přes síť na tohle nestačí**."
              echo "Kdo má APK v telefonu, přestane dostávat novinky, dokud si nenainstaluje nové."
              echo ""
              echo "| | |"
              echo "|---|---|"
              echo "| otisk teď | \`$otisk\` |"
              echo "| otisk vydaného APK | \`$vydane\` (z $kdy) |"
              echo ""
              echo "**Balíček do Play staví úloha \`balicek-do-play\` sama**, takže"
              echo "testeři z obchodu novou verzi dostanou bez cizí pomoci."
              echo ""
              echo "Ruční zůstalo jen APK na webu: \`cd app && npm run apk\`, pak přepsat"
              echo "\`APK_URL\` v \`deploy/docker-compose.yml\` i údaje"
              echo "v \`app/vydane-apk.json\` a poslat lidem příručku"
              echo "\`docs/NAVOD-APPKA-AKTUALIZACE.md\`."
            } >> "$GITHUB_STEP_SUMMARY"
            chyba=1
          fi

          if [ "$chyba" = "0" ]; then
            echo "Appka se aktualizuje přes síť; ruční instalace není potřeba." >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$chyba"

      # Pořadí na vodě je pravidlo, ne vykreslování: dojetá loď se nesmí
      # hýbat, i když jí průmět na trať po cíli sjede. Test běží na čisté
      # funkci, takže nepotřebuje prohlížeč ani závislosti webu.
      - name: Testy pravidel webu
        run: npm run testy
        working-directory: web

  integrace:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Čtení ze zrcadla základních obrazů; zapisovat sem nemá co.
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      # Tatáž cache jako v jobu `build` a schválně se stejným klíčem: oba
      # joby restorují totéž řešení, takže se o jeden záznam dělí. Kdo
      # z nich doběhne první, ten cache uloží.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Integrační testy
        run: dotnet test -c Release --nologo --filter "Category=Integracni"
        env:
          # Licence ImageSharpu: `dotnet test -c Release` ji vyžaduje stejně jako
          # publish (v Debugu je to jen varování, proto to lokálně neselže).
          SIXLABORS_LICENSE_KEY: ${{ secrets.SIXLABORS_LICENSE_KEY }}
          # PostgreSQL ze zrcadla, ne z Docker Hubu. Lokálně se proměnná
          # nenastavuje a `PostgresFixture` sáhne na Hub jako dřív — jeden
          # vývojářský stroj limit nevyčerpá.
          POSTGRES_IMAGE: ghcr.io/${{ github.repository }}/zrcadlo/postgres:17-alpine-${{ env.ZRCADLO_ZNACKA }}
          # Ryuk uklízí kontejnery po skončení testů a tahá se taky z Hubu.
          # Na runneru, který se po běhu zahodí celý, není co uklízet.
          # Schválně jen tady, ne v kódu: lokálně uklízet potřeba je.
          TESTCONTAINERS_RYUK_DISABLED: 'true'

  # Nasazení. Vlastní úloha, ne poslední krok buildu, a to ze tří důvodů:
  #
  # 1. **Čeká na testy.** Dokud byl deploy krokem buildu, běžel vedle
  #    integrace — červená integrace tak mohla znamenat už nasazenou vadnou
  #    verzi, protože produkce se změnila dřív, než byl výsledek.
  # 2. **Jedno nasazení naráz.** Skupina souběhu platí pro všechny cesty do
  #    produkce, tedy i pro ruční spuštění. `cancel-in-progress: false`
  #    schválně: rozdělaný deploy se nepřeruší, další počká.
  # 3. **Nevrací produkci do minulosti.** Fronta sama nestačí — GitHub řadí
  #    podle okamžiku vstupu do skupiny, ne podle stáří commitu, takže
  #    pozdě doběhlý starý build se zařadí za novější. Proto se před
  #    odesláním čte, co na produkci běží, a starší commit se neposílá.
  nasazeni:
    needs: [build, appka, integrace]
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    concurrency:
      group: nasazeni-produkce
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Celá historie: bez ní nejde říct, jestli je běžící commit
          # potomkem toho nasazovaného, tedy novější.
          fetch-depth: 0

      # Prázdná `DEPLOY_WEBHOOK` dávala **zelený běh, nedotčenou produkci
      # a nulovou stopu** (audit 8. 10. 2026). Byl to nejhorší možný tvar
      # poruchy: ochrana proti návratu do minulosti ze 6. 10. 2026 na něj
      # mlčí, protože ta hlídá, *co* se nasazuje, ne *jestli* se nasazuje.
      #
      # Stojí to první, ještě než se čte produkce: job, který nemá kam
      # nasadit, nemá co dělat ani kontroly.
      - name: Je kam nasadit
        run: |
          if [ -z "${{ vars.DEPLOY_WEBHOOK }}" ]; then
            echo "::error::Proměnná DEPLOY_WEBHOOK je prázdná, takže se nemá kam nasadit."
            echo "Dokud chybí, byl by běh zelený a produkce by se nehnula."
            echo "Doplň ji v nastavení repozitáře (Settings → Secrets and variables → Actions → Variables)."
            exit 1
          fi
          echo "DEPLOY_WEBHOOK je nastavená."

      # Co na produkci běží teď. Tenhle krok sám nepadá (`|| true`), protože
      # rozhodnutí patří kroku „Nevracet produkci do minulosti" pod ním:
      # nečitelná verze nasazení **zastaví** a cesta ven je ruční spuštění
      # s `obnova = true` (zdůvodnění tam, 6. 10. 2026).
      - name: Co běží na produkci
        id: bezi
        run: |
          api=$(curl -fsS --max-time 20 "$API_URL/verze" 2>/dev/null \
            | python3 -c "import json,sys; print(json.load(sys.stdin).get('verze',''))" 2>/dev/null || true)
          echo "sha=$api" >> "$GITHUB_OUTPUT"
          echo "Na produkci běží API: ${api:-neznámá}"

      # Jádro ochrany: nasazovaný commit nesmí být předkem toho běžícího.
      # Když je, je běžící verze novější a tenhle build dorazil pozdě.
      - name: Nevracet produkci do minulosti
        id: kontrola
        run: |
          bezi='${{ steps.bezi.outputs.sha }}'
          obnova='${{ inputs.obnova }}'

          # Nečitelná verze ochranu neobchází. Výpadek `/verze` by jinak
          # stačil k tomu, aby starý build přepsal produkci — a vypadalo by
          # to jako obyčejné nasazení (oponentura, 6. 10. 2026).
          #
          # Cesta ven je výslovná: spustit znovu ručně s `obnova = true`.
          # Je to i cesta pro případ, kdy produkce neodpovídá právě proto,
          # že je rozbitá a nasadit se musí.
          if [ -z "$bezi" ] || ! git cat-file -e "$bezi^{commit}" 2>/dev/null; then
            duvod="Nedá se přečíst, co na produkci běží"
            [ -n "$bezi" ] && duvod="Produkce hlásí verzi $bezi, která v historii není"
            if [ "$obnova" = "true" ]; then
              echo "::warning::$duvod. Běží režim obnovy, nasazuje se."
              echo "nasadit=ano" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::$duvod, takže nejde ověřit, že tenhle build není starší."
            echo "Spusť build-deploy ručně nad main s volbou obnova, pokud to tak má být."
            exit 1
          fi
          if [ "$bezi" = "${{ github.sha }}" ]; then
            echo "Na produkci už běží tenhle commit, nasazuje se znovu."
            echo "nasadit=ano" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git merge-base --is-ancestor "${{ github.sha }}" "$bezi"; then
            echo "::warning::Na produkci běží novější commit ($bezi)." \
              "Tenhle build (${{ github.sha }}) je jeho předek a nasazením by" \
              "produkci vrátil do minulosti. Přeskakuje se."
            echo "nasadit=ne" >> "$GITHUB_OUTPUT"
          else
            echo "nasadit=ano" >> "$GITHUB_OUTPUT"
          fi

      # Server si novou image stáhne sám. Posílá se i compose ze STEJNÉHO
      # commitu, ze kterého je image — jinak by se nasadila nová aplikace
      # se starým nastavením a chybějící tajemství by se projevilo až za běhu.
      #
      # Tajemství jde hlavičkou, ne v URL: adresa se objevuje v logu běhu.
      #
      # `X-Deploy-Sha` a `X-Deploy-Poradi` jsou pro server: tutéž kontrolu
      # dělá ještě jednou **pod svým zámkem**, takže mezi ni a nasazení se
      # nevejde druhý build. Ta zdejší běží mimo zámek a zavírá jen naše
      # vlastní cesty (`platform#7`). Pořadí je čas commitu v sekundách —
      # háček repozitář nemá a předka od potomka sám nepozná.
      #
      # `X-Deploy-Obnova` posílá výslovné vrácení na starší build dál, aby
      # ho server neodmítl: tady už je rozhodnuté, že se tak stát má.
      #
      # <b>Selhání přenosu tenhle krok neshodí.</b> Návratový kód `curl`u se
      # jen zapamatuje a rozhodnutí patří kroku pod ním, který čte `/verze`:
      # odpověď háčku není důkaz, že se nasadilo, a její ztráta není důkaz,
      # že se nenasadilo. Měřeno 17. 11. 2026, dvakrát za sebou
      # `curl: (56) Recv failure: Connection reset by peer` po ~60 s
      # (běhy 44182164236 a 44186217325) — a produkce přitom v obou
      # případech běžela přesně ten commit, který se posílal.
      - name: Deploy
        id: deploy
        if: ${{ steps.kontrola.outputs.nasadit == 'ano' }}
        run: |
          poradi=$(git log -1 --format=%ct "${{ github.sha }}")
          echo "Posílám ${{ github.sha }}, čas commitu $poradi."
          kod=0
          curl -fsS --max-time 900 -X POST "${{ vars.DEPLOY_WEBHOOK }}" \
            -H "X-Deploy-Token: ${{ secrets.DEPLOY_TOKEN }}" \
            -H "X-Deploy-Sha: ${{ github.sha }}" \
            -H "X-Deploy-Poradi: $poradi" \
            -H "X-Deploy-Obnova: ${{ inputs.obnova == true && 'ano' || 'ne' }}" \
            -H "Content-Type: application/yaml" \
            --data-binary @deploy/docker-compose.yml || kod=$?
          if [ "$kod" -eq 0 ]; then
            echo "prenos=ok" >> "$GITHUB_OUTPUT"
            echo "Háček odpověděl."
          else
            echo "prenos=selhal" >> "$GITHUB_OUTPUT"
            echo "kod=$kod" >> "$GITHUB_OUTPUT"
            echo "::warning::Háček neodpověděl, curl skončil s kódem $kod." \
              "Jestli nasazení přesto proběhlo, rozhodne ověření verze."
          fi

      # `Healthy` a HTTP 200 vrací i verze, která tam visí z minula, takže
      # samy o sobě nedokazují nic. Porovnává se skutečná verze obou služeb.
      #
      # Čeká se omezeně (20 × 15 s) a pak se **musí** vědět. Neověřený
      # výsledek končí chybou, i po obnově: zelená nad službou, o které
      # nevíme, co na ní běží, je falešná jistota.
      #
      # <b>Tenhle krok je jediný, kdo o výsledku nasazení rozhoduje.</b>
      # Odpověď háčku není důkaz, že se nasadilo, a její ztráta není důkaz,
      # že se nenasadilo — mezi GitHubem a hostitelem je proxy a ta umí
      # spojení zahodit nad doběhlým nasazením. Proto `Deploy` nad tímhle
      # krokem nepadá a verdikt stojí jen na tom, co obě služby vydávají.
      #
      # Změřené případy, všechny se stejným tvarem: 10. 11. 2026 u `fed3857`
      # vrátila proxy 520 po 43 s; 17. 11. 2026 třikrát `curl: (56)` po
      # ~60 s (běhy 44182164236, 44186217325 a 44196148901). Pokaždé
      # produkce běžela přesně ten commit, který se posílal, a ruční
      # spuštění spadlé úlohy prošlo — u toho posledního to dokonce přečetl
      # sám workflow: následující běh našel na produkci `c526d726`, jehož
      # nasazení hlásilo selhání.
      # <b>Rozdíl je v následku:</b> dokud takový běh končil červeně,
      # přeskočila se kvůli `needs: [nasazeni]` i `aktualizace-appky` —
      # server běžel nový a telefony starý JavaScript, a poznat se to dalo
      # jen dotazem na manifest `u.expo.dev` (17. 11. 2026 to stálo půl
      # hodiny hledání v kódu, který byl správně).
      #
      # <b>Nic se tím nezměkčuje.</b> Nesedící nebo nepřečtená verze je dál
      # chyba, ne varování, i po obnově: zelená nad službou, o které nevíme,
      # co na ní běží, je falešná jistota (oponentura, 6. 10. 2026). Mizí
      # jen poplach z toho, *jak* se o výsledku dozvíme.
      #
      # Čeká se omezeně (20 × 15 s) a pak se **musí** vědět.
      #
      # <b>`always()`, a po zrušení se jen jednou zeptá</b> (22. 11. 2026).
      # Stálo tu `!cancelled()` s tím, že po zrušení nemá smysl pět minut
      # čekat na `/verze` a držet tím zrušení. To čekání smysl nemá, ale
      # ten dotaz ano: `Deploy` se dá zrušit uprostřed, a to je právě
      # chvíle, kdy se nikdo nedozví, co na produkci zůstalo. Běh
      # 45070281902 (`12f22c9f`): krok `Deploy` skončil po 57 s stavem
      # `cancelled`, ověření se přeskočilo, úloha spadla — a produkce
      # přitom běžela přesně ten commit, který se posílal. Proč se krok
      # zrušil, se už nedoloží: log toho jobu GitHub nemá
      # (`BlobNotFound`), takže se tu nehádá příčina, opravuje se následek.
      #
      # Po zrušení tedy jeden dotaz bez čekací smyčky, výsledek do souhrnu,
      # a `exit 0`: verdikt si tahle větev nepřisvojuje. Úloha je zrušená
      # nebo červená tak jako tak a nic se nezměkčuje — jen se přestane
      # tipovat, co na produkci je.
      #
      # <b>Vydání do telefonů to neřeší.</b> `aktualizace-appky` visí na
      # `needs: [nasazeni]`, takže se po zrušeném nasazení přeskočí dál;
      # cesta ven je ruční spuštění úlohy.
      # Stav zrušení se sem musí donést výstupem kroku, ne výrazem.
      # `cancelled()` je status check funkce a ta smí stát **jen v `if:`**:
      # pro `jobs.<job_id>.steps.env` je povolená jediná zvláštní funkce,
      # `hashFiles`. Workflow s `${{ cancelled() }}` v `env:` GitHub odmítne
      # celý — běh skončí v tutéž vteřinu, v jaké vznikl, s nulou úloh,
      # bez jediné anotace a bez logu, takže se příčina z něj nepozná.
      # Stalo se to 22. 11. 2026 běhu 45076919836 u `abf33cfa` a nejelo
      # kvůli tomu nic. Pozná to `actionlint` (`brew install actionlint`,
      # `actionlint .github/workflows/build-deploy.yml`) — a protože tenhle
      # druh chyby zabije celý workflow dřív než jeho vlastní úlohy, hlídá
      # ho od té doby **samostatný** `kontrola-workflow.yml`, který zůstane
      # platný i tehdy, když je tenhle soubor rozbitý.
      - name: Je běh zrušený?
        id: zruseno
        if: ${{ cancelled() }}
        run: echo "ano=true" >> "$GITHUB_OUTPUT"

      - name: Ověřit, co doopravdy běží
        if: ${{ always() && steps.kontrola.outputs.nasadit == 'ano' }}
        env:
          ZRUSENO: ${{ steps.zruseno.outputs.ano }}
        run: |
          ocekavano='${{ github.sha }}'
          prenos='${{ steps.deploy.outputs.prenos }}'
          kod='${{ steps.deploy.outputs.kod }}'
          chyba=0

          if [ "$ZRUSENO" = "true" ]; then
            api=$(curl -fsS --max-time 20 "$API_URL/verze" 2>/dev/null \
              | python3 -c "import json,sys; print(json.load(sys.stdin).get('verze',''))" 2>/dev/null || true)
            web=$(curl -fsS --max-time 20 "$WEB_URL/verze" 2>/dev/null \
              | python3 -c "import json,sys; print(json.load(sys.stdin).get('verze',''))" 2>/dev/null || true)
            echo "Běh byl zrušen; nečeká se, jen se jednou přečte produkce."
            echo "čekáno: $ocekavano"
            echo "API:    ${api:-neodpovědělo}"
            echo "web:    ${web:-neodpovědělo}"
            {
              echo "### Zrušeno uprostřed nasazení"
              echo
              if [ "$api" = "$ocekavano" ] && [ "$web" = "$ocekavano" ]; then
                echo "Obě služby vydávají \`$ocekavano\`, takže nasazení"
                echo "proběhlo ještě před zrušením. Vydání do telefonů se"
                echo "ale přeskočilo — spusť úlohu ručně."
              else
                echo "Produkce nevydává nasazovaný commit. Spusť úlohu znovu."
              fi
              echo
              echo "| | verze |"
              echo "|---|---|"
              echo "| čekáno | \`$ocekavano\` |"
              echo "| API | \`${api:-neodpovědělo}\` |"
              echo "| web | \`${web:-neodpovědělo}\` |"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          for _ in $(seq 1 20); do
            api=$(curl -fsS --max-time 20 "$API_URL/verze" 2>/dev/null \
              | python3 -c "import json,sys; print(json.load(sys.stdin).get('verze',''))" 2>/dev/null || true)
            web=$(curl -fsS --max-time 20 "$WEB_URL/verze" 2>/dev/null \
              | python3 -c "import json,sys; print(json.load(sys.stdin).get('verze',''))" 2>/dev/null || true)
            [ "$api" = "$ocekavano" ] && [ "$web" = "$ocekavano" ] && break
            sleep 15
          done
          echo "čekáno: $ocekavano"
          echo "API:    ${api:-neodpovědělo}"
          echo "web:    ${web:-neodpovědělo}"

          # Neověřený výsledek je chyba, ne varování. Zelená úloha nad
          # službou, o které nevíme, co na ní běží, je falešná jistota —
          # a platí to dvojnásob po obnově, kde se nasazovalo právě proto,
          # že se verze přečíst nedala (oponentura, 6. 10. 2026).
          [ -n "$api" ] || { echo "::error::API po nasazení verzi nevydalo."; chyba=1; }
          [ -n "$web" ] || { echo "::error::Web po nasazení verzi nevydal."; chyba=1; }
          [ -z "$api" ] || [ "$api" = "$ocekavano" ] \
            || { echo "::error::API běží na jiné verzi."; chyba=1; }
          [ -z "$web" ] || [ "$web" = "$ocekavano" ] \
            || { echo "::error::Web běží na jiné verzi."; chyba=1; }

          if [ "$chyba" -ne 0 ]; then
            if [ "$prenos" != "ok" ]; then
              {
                echo "### Nasazení selhalo"
                echo
                echo "Háček neodpověděl (curl skončil s kódem $kod)"
                echo "a verze se neshoduje ani po čekání."
                echo
                echo "| | verze |"
                echo "|---|---|"
                echo "| čekáno | \`$ocekavano\` |"
                echo "| API | \`${api:-neodpovědělo}\` |"
                echo "| web | \`${web:-neodpovědělo}\` |"
              } >> "$GITHUB_STEP_SUMMARY"
            fi
            exit 1
          fi

          # Přenos selhal, ale obě služby vydávají nasazovaný commit.
          # Nasazení je hotové; úloha končí zeleně, aby se kvůli planému
          # poplachu nepřeskočilo vydání aktualizace appky. Do souhrnu se
          # to napíše, protože ztracená odpověď je pořád něco, co má být
          # vidět — jen to není selhání nasazení.
          if [ "$prenos" != "ok" ]; then
            {
              echo "### Háček neodpověděl, nasazení přesto proběhlo"
              echo
              echo "curl skončil s kódem $kod, ale API i web vydávají"
              echo "\`$ocekavano\`. Nasazení je tedy hotové a úloha pokračuje."
              echo
              echo "Spojení mezi GitHubem a hostitelem se rozpadlo nad už"
              echo "doběhlým nasazením. Když se to opakuje, viník je"
              echo "v cestě (proxy před \`deploy.klihovka.cz\`), ne v háčku."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Háček neodpověděl (curl $kod), ale obě služby běží na $ocekavano." \
              "Nasazení se považuje za hotové."
          fi
          exit 0

  # <b>Doručení aktualizace do telefonů.</b> Appka má `expo-updates` zapnuté
  # od 28. 10. 2026, ale do toho dne v kanálu `preview` leželo **nula**
  # publikovaných aktualizací: telefon umí novinku přijmout, jen mu ji nikdo
  # neposílal. „Appka se aktualizuje sama" tedy platilo o schopnosti, ne
  # o provozu — a příručka přitom Milošovi slibovala, že stahovat nebude.
  #
  # <b>Běží až po nasazení</b>, ne vedle něj: appka mluví s API a vézt do
  # telefonu kód, který čeká na endpoint, jenž ještě není venku, by znamenalo
  # rozbít ji na dobu nasazení.
  aktualizace-appky:
    needs: [nasazeni]
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Dva commity stačí ke zjištění, jestli se appka změnila.
          fetch-depth: 2

      # <b>Bez změny v appce se nepublikuje.</b> Každá publikace je pro
      # telefon nová verze, takže by se po každém commitu do mainu rozsvítil
      # banner „appka se sama aktualizovala" — i když se na ní nic nezměnilo.
      # Otravné oznámení si lidé vypnou a pak jim unikne to pravé.
      - name: Změnila se appka?
        id: zmena
        run: |
          pred='${{ github.event.before }}'
          # Prázdný nebo nulový hash (první push do větve, ruční spuštění):
          # porovná se s rodičem.
          case "$pred" in
            ''|0000000000000000000000000000000000000000) pred="${{ github.sha }}^" ;;
          esac
          if git diff --quiet "$pred" '${{ github.sha }}' -- app/ 2>/dev/null; then
            echo "publikovat=ne" >> "$GITHUB_OUTPUT"
            echo "Appka se nezměnila, aktualizace se nepublikuje." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "publikovat=ano" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ steps.zmena.outputs.publikovat == 'ano' }}
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Závislosti appky
        if: ${{ steps.zmena.outputs.publikovat == 'ano' }}
        run: npm ci
        working-directory: app

      # <b>Proč se bundle staví zvlášť a `eas update` dostane `--input-dir`.</b>
      # `eas update` si umí zabundlovat sám, ale proměnné `EXPO_PUBLIC_*` mu
      # ze shellu neprojdou — bere je z EAS environmentu, a ten je prázdný.
      # Metro přitom `process.env.EXPO_PUBLIC_*` **zapéká do bundle** při
      # transformaci, takže bez nich je v `identita.ts` prázdný řetězec
      # a `prihlasovaniJde` vyjde `false`. Změřeno 28. 10. 2026: čistý export
      # bez proměnných adresu poskytovatele v bundle nemá, s nimi ano.
      # Stalo se to doopravdy — první publikovaná aktualizace tím vypnula
      # přihlašování a musela se přebít druhou.
      #
      # Hodnoty se čtou z `eas.json`, aby nebyly zapsané na dvou místech
      # a nerozešly se.
      #
      # <b>Per platformu, ne `--platform all`.</b> `all` pustí i webový
      # export, a ten padá na `expo-sqlite`, které na webu chce WASM.
      # <b>Proč je to vlastní krok a ne řádek v tom dalším.</b> Krok
      # publikace má `continue-on-error: true`, takže zastavená publikace
      # by svítila zeleně a zbyl by po ní varovný řádek — přesně ten, co
      # si nikdo nepřečte. Tahle kontrola proto stojí samostatně
      # a **shodí úlohu**.
      #
      # <b>Neměří rovnost, měří úplnost.</b> Rovnost sama projde i tehdy,
      # když `env` chybí v obou profilech (`None == None`), a Metro pak
      # zapeče do bundlu prázdnou adresu poskytovatele identity — appka
      # vyjde s vypnutým přihlašováním a v hotovém balíku to nepoznáš.
      # Stalo se 28. 10. 2026; tehdy šel bundle do jednoho kanálu, dnes
      # by šel do obou včetně appky z obchodu.
      - name: Mají oba kanály tytéž proměnné?
        if: ${{ steps.zmena.outputs.publikovat == 'ano' }}
        working-directory: app
        run: |
          python3 - <<'PY'
          import json, sys

          POVINNE = ("EXPO_PUBLIC_IDENTITA_AUTHORITY", "EXPO_PUBLIC_IDENTITA_CLIENT_ID")
          b = json.load(open("eas.json"))["build"]
          chyby = []
          for profil in ("preview", "production"):
              env = (b.get(profil) or {}).get("env") or {}
              for k in POVINNE:
                  if not env.get(k):
                      chyby.append(f"{profil}: {k} chybi nebo je prazdna")
          if (b.get("preview") or {}).get("env") != (b.get("production") or {}).get("env"):
              chyby.append(
                  "profily preview a production maji jine EXPO_PUBLIC_*; "
                  "exportuj pro kazdy kanal zvlast"
              )
          if chyby:
              sys.exit("eas.json: " + "; ".join(chyby))
          PY

      - name: Publikovat aktualizaci appky
        if: ${{ steps.zmena.outputs.publikovat == 'ano' }}
        continue-on-error: true
        working-directory: app
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          # <b>Zpráva jde prostředím, ne do příkazu.</b> Dosazená rovnou
          # do `run:` by se rozbila na první uvozovce v commitu — stalo se
          # 30. 10. 2026 u commitu s citací a `eas update` si slova z ní
          # vzal jako argumenty („Unexpected arguments: jak, si, tam"),
          # takže aktualizace tiše nevyšla a úloha svítila zeleně.
          # Shell by z ní navíc spustil `$(…)`, co by v ní stálo.
          ZPRAVA_COMMITU: ${{ github.event.head_commit.message || 'Aktualizace appky' }}
        run: |
          if [ -z "${EXPO_TOKEN:-}" ]; then
            echo "::warning::Chybí EXPO_TOKEN, aktualizace appky se nepublikovala."
            {
              echo "### ⚠️ Aktualizace appky se nepublikovala"
              echo ""
              echo "V secrets repozitáře chybí \`EXPO_TOKEN\`, takže novinky v appce"
              echo "zůstaly jen v gitu. Kdo má APK v telefonu, je nedostane."
              echo ""
              echo "**Co s tím:** vyrobit token na"
              echo "<https://expo.dev/settings/access-tokens> a vložit ho jako"
              echo "\`EXPO_TOKEN\` do Settings → Secrets → Actions."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Jedna pravda o konfiguraci: profil `preview` v eas.json.
          eval "$(python3 -c 'import json; e=json.load(open("eas.json"))["build"]["preview"]["env"]; print("\n".join(f"export {k}={json.dumps(v)}" for k, v in e.items()))')"

          # Jen první řádek: `--message` je popisek, ne celý commit.
          zprava="${ZPRAVA_COMMITU%%$'\n'*}"

          chyba=0
          for p in android ios; do
            rm -rf dist
            npx expo export --clear --platform "$p" --output-dir dist || { chyba=1; continue; }
            for kanal in preview production; do
              npx eas-cli@latest update --channel "$kanal" --platform "$p" \
                --input-dir dist --skip-bundler --non-interactive \
                --environment preview \
                --message "$zprava" \
                || chyba=1
            done
          done

          if [ "$chyba" = "0" ]; then
            echo "Aktualizace appky publikována do kanálů \`preview\` a \`production\`." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Publikace aktualizace appky selhala; novinky zůstaly jen v gitu."
          fi
          exit "$chyba"

  # <b>Nativní změna si řekne o nový balíček sama.</b> Aktualizace po síti
  # nese jen JavaScript a doručí se jedině do appky se **stejným nativním
  # otiskem** (`runtimeVersion: fingerprint`). Když se otisk posune — nové
  # oprávnění, nová nativní závislost, jiné SDK — appka v telefonu se
  # tiše přestane aktualizovat.
  #
  # Dosud to byl jen varovný řádek v souhrnu (úloha `appka`, krok *Žádá
  # appka ruční instalaci?*) a čekalo se, že si ho někdo přečte a balíček
  # postaví rukou. Dvakrát se nestalo. Tohle je ta samá informace, ale
  # provedená: `app/scripts/stav-play.sh` porovná otisk dnešního stromu
  # s otiskem posledního **dokončeného** buildu profilu `production` a při
  # rozdílu se balíček postaví a nahraje do Play.
  #
  # <b>Stav se drží na EAS, ne v souboru.</b> Soubor v repozitáři by
  # znamenal zápis z CI zpátky do mainu a tím riziko smyčky; EAS navíc ví,
  # co se doopravdy postavilo, kdežto soubor jen to, co si někdo zapamatoval
  # zapsat. Právě na tom rozchodu stál sedm týdnů starý odkaz na `/appka`.
  #
  # <b>Nečeká na `nasazeni` schválně.</b> `aktualizace-appky` na něm visí
  # a tenhle workflow si sám výš píše, co to dělá: po zrušeném nebo falešně
  # červeném nasazení se vydání do telefonů **přeskočí** a cesta ven je
  # ruční spuštění úlohy. To je přesně ta ruční práce, kterou tahle úloha
  # ruší, takže ji nemá cenu dědit. Pořadí místo toho hlídá krok *Je tohle
  # špice mainu?*, který je proti návratu do minulosti silnější: nezávisí
  # na barvě cizí úlohy, ale na tom, co je doopravdy na větvi.
  #
  # <b>Co tím pořád není zaručené</b> a ví se o tom: strop na čas uvolní
  # skupinu souběhu, zatímco build na EAS běží dál a `--auto-submit` ho
  # nahraje. Následující běh ten rozdělaný build v `--status finished`
  # nevidí, takže může postavit druhý. Zámek jako u nasazovacího háčku
  # (`platform#7`) by to zavřel; dokud se to nestane, je to známá mezera,
  # ne nedopatření.
  balicek-do-play:
    needs: [build, appka, integrace]
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    # Čeká se na dokončení buildu na serverech Expa, aby bylo z logu vidět,
    # že se balíček doopravdy nahrál. Na bezplatném tarifu se stojí ve
    # frontě, proto strop — bez něj by zaseknutá fronta žrala minuty
    # Actions, které jsou podle `platform/docs/KVOTY.md` nejbližší zeď.
    timeout-minutes: 60
    permissions:
      contents: read
    # Obchod je sdílený stav jako produkce: dvě souběžná nahrání by si
    # přebila verzi. `cancel-in-progress: false` — rozdělané nahrávání se
    # neruší, dokončí se a další počká.
    concurrency:
      group: balicek-do-play
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Dva commity stačí ke zjištění, jestli se appka změnila.
          fetch-depth: 2

      # <b>Na otisk se ptáme vždycky, i když se `app/` v tomhle pushi
      # nezměnilo.</b> První podoba tady měla filtr na diff, aby úloha
      # nedělala `npm ci` po každém pushi — a hned si ho vyzkoušela:
      # commit, který `app/` změnil, dostal zrušený běh (novější push
      # přišel o necelou minutu později) a ten novější sáhl jen na
      # workflow, takže filtr úlohu zastavil. Posunutý otisk tedy nikdo
      # neviděl a balíček se nepostavil. Je to táž tichá mezera, jakou
      # tahle úloha ruší, jen postavená o úroveň výš.
      #
      # Dotaz na otisk je proti tomu imunní, protože porovnává **dnešní
      # strom s obchodem**, ne dva commity: ať se běhy ruší, jak chtějí,
      # první, který doběhne, rozdíl uvidí. Stojí to `npm ci` a dvě
      # stažení přes `npx` na každý push do mainu — levnější než jedno
      # přeskočené vydání, které se pozná až z telefonu.

      # <b>Nahrávat smí jen špice větve.</b> Bez tohohle se do obchodu
      # dostane starší commit: souběžné běhy se na `main` neruší, starší
      # nasazení se přeskočí **zeleně**, a tím by starší běh dostal volno
      # postavit a nahrát svůj commit s vyšším `versionCode`. V obchodě by
      # pak byla nativní appka z A, na produkci kód z B a otisky by se
      # nesešly — tedy přesně ta vada, kterou tahle úloha ruší, jen
      # způsobená jí samotnou.
      - name: Je tohle špice mainu?
        id: spice
        run: |
          git fetch --depth=1 origin main
          spice=$(git rev-parse FETCH_HEAD)
          if [ "$spice" = "${{ github.sha }}" ]; then
            echo "aktualni=ano" >> "$GITHUB_OUTPUT"
          else
            echo "aktualni=ne" >> "$GITHUB_OUTPUT"
            {
              echo "### Balíček do Play se z tohohle běhu nenahrává"
              echo ""
              echo "Na \`main\` je mezitím novější commit (\`${spice:0:8}\`), takže"
              echo "balíček z tohohle běhu by vrátil appku v obchodě do minulosti."
              echo "Novější běh si o něj řekne sám, pokud ho potřebuje."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ steps.spice.outputs.aktualni == 'ano' }}
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Závislosti appky
        if: ${{ steps.spice.outputs.aktualni == 'ano' }}
        run: npm ci
        working-directory: app

      # <b>Chybějící token je chyba, ne varování.</b> Bez něj se nedá
      # zjistit ani stav obchodu, ani nic nahrát — a tichá zelená by
      # vrátila přesně ten stav, který tahle úloha ruší: telefon bez
      # novinek a nikdo o tom neví. Repozitář má tohle pravidlo zapsané
      # u nasazení: neověřený výsledek je chyba.
      - name: Je potřeba nový balíček?
        id: stav
        if: ${{ steps.spice.outputs.aktualni == 'ano' }}
        working-directory: app
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "${EXPO_TOKEN:-}" ]; then
            {
              echo "### Stav balíčku pro Play se nedá zjistit"
              echo ""
              echo "V secrets repozitáře chybí \`EXPO_TOKEN\`. Dokud chybí, nejde"
              echo "poznat, co je v obchodě, ani tam nic nahrát — a appka v telefonu"
              echo "se po nativní změně tiše přestane aktualizovat."
              echo ""
              echo "**Co s tím:** vyrobit token na"
              echo "<https://expo.dev/settings/access-tokens> a vložit ho jako"
              echo "\`EXPO_TOKEN\` do Settings → Secrets → Actions."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Chybí EXPO_TOKEN, balíček do Play se nedá vyřešit."
            exit 1
          fi
          # Ne přes `| tee`: tee by svým nulovým kódem schoval selhání
          # skriptu, a ten schválně rozlišuje `nevim` od `ne`.
          vystup=$(scripts/stav-play.sh production)
          echo "$vystup"
          echo "$vystup" >> "$GITHUB_OUTPUT"

      - name: Postavit balíček a nahrát do Play
        if: ${{ steps.stav.outputs.POTREBA == 'ano' && github.event.inputs.nahrat_znovu != 'true' }}
        working-directory: app
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          # `--auto-submit` nahraje hotový balíček do Play na track, který
          # je v `submit.production` v `eas.json` (dnes `internal`). Klíč
          # servisního účtu k tomu drží EAS, ne tento repozitář — v gitu
          # ani v secrets GitHubu tedy žádné přihlašovací údaje ke Googlu
          # nejsou.
          #
          # <b>Připnutá verze, ne `@latest`.</b> Tenhle krok drží token
          # a má zapojenou cestu do obchodu; `@latest` by znamenal, že si
          # v něm cizí balík může spustit kód. Repozitář pinuje akce na
          # otisk commitu z téhož důvodu.
          #
          # Selhání se zabalí do srozumitelné věty: nejčastější příčina na
          # začátku je, že klíč servisního účtu na EAS ještě není, a hlášení
          # z CLI to samo o sobě neřekne.
          if ! npx -y eas-cli@27.11.0 build --platform android --profile production \
            --non-interactive --auto-submit; then
            {
              echo "### Balíček se nepostavil nebo se nenahrál do Play"
              echo ""
              echo "Příčina je v logu kroku. Hlásí-li EAS **Google Service Account Keys"
              echo "cannot be set up in --non-interactive mode**, chybí na EAS klíč"
              echo "servisního účtu: vyrobí se v Play Console (*API access*), nahraje se"
              echo "do credentials projektu na expo.dev a v repozitáři být nemá."
              echo ""
              echo "**Balíček nejspíš vznikl i tak.** Ověřeno 25. 11. 2026: EAS build"
              echo "zařadí a teprve pak kontroluje údaje k obchodu, takže \`eas build\`"
              echo "skončí chybou, ale stavba na serveru doběhne. Otisk pak v EAS sedí"
              echo "a **samo se to podruhé nezkusí** — další běh řekne „není potřeba\"."
              echo ""
              echo "Cesta ven je proto ruční spuštění workflow s volbou **nahrat_znovu**:"
              echo "nahraje poslední hotový balíček bez nové stavby. Ověř si v seznamu"
              echo "buildů, že ten poslední opravdu má dnešní otisk."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      # <b>Cesta ven pro spadlé nahrání.</b> Když se build povedl a spadlo
      # až nahrání, samo se to podruhé nezkusí — otisk už sedí. Tahle
      # volba proto **nestaví nic nového**, jen nahraje poslední hotový
      # balíček: stavět znovu by byla dvacetiminutová práce pro nic
      # a vyrobilo by to v obchodě zbytečně další `versionCode`.
      - name: Nahrát poslední balíček znovu
        if: ${{ steps.spice.outputs.aktualni == 'ano' && github.event.inputs.nahrat_znovu == 'true' }}
        working-directory: app
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if ! npx -y eas-cli@27.11.0 submit --platform android --profile production \
            --latest --non-interactive; then
            {
              echo "### Nahrání posledního balíčku do Play se nepovedlo"
              echo ""
              echo "Příčina je v logu kroku. Nejčastěji chybí na EAS **klíč servisního"
              echo "účtu Google** — vyrobí se v Play Console (*API access*) a nahraje"
              echo "se do credentials projektu na expo.dev."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      # <b>Appka se musí dozvědět, že je venku nový balíček</b> (Filip,
      # 26. 11. 2026: *„aby se to nemuselo odhadovat"*). Aktualizace po síti
      # hledá jen pro otisk, na kterém sama běží — po nativní změně by tedy
      # hlásila „jsi aktuální", zatímco v Play leží nová verze. Tenhle zápis
      # jí dá s čím porovnat (`GET /appka/vydani/android`).
      #
      # <b>Až po nahrání, ne po buildu image.</b> Image se nasazuje o půl
      # hodiny dřív, než balíček projde frontou Expa; zápis z nasazení by
      # posílal lidi do obchodu, kde ještě nic není. Proto tady, za oběma
      # cestami do Play, a jen když jedna z nich doopravdy proběhla —
      # spadlé nahrání ukončí úlohu dřív a zápis se nestane.
      #
      # <b>Selhání je chyba, ne varování.</b> Balíček je v Play tak jako
      # tak; červená úloha jen řekne, že o něm appka neví. Nic dalšího na ní
      # nevisí — `aktualizace-appky` čeká na `nasazeni`, ne na tuhle úlohu.
      #
      # <b>Při každém běhu na špici, ne jen po stavbě</b> (nález kontroly
      # 27. 11. 2026). Když zápis po nahrání selže, opakovaný běh dostane
      # POTREBA=ne a krok by se přeskočil — a vydání by v API nechybělo jen
      # jednou, ale navždy. Zápis je na serveru idempotentní (platforma ×
      # číslo balíčku), takže opakování nic nezdvojí, jen dopíše chybějící.
      # Cena: když se build povedl a nahrání do Play ne, další běh zapíše
      # balíček, který v obchodě ještě není — appka pak napíše, že Play ho
      # telefonu „ještě nenabídl". Lepší než osmnáctky, které se nedozví nic.
      - name: Zapsat vydání pro appku
        if: ${{ steps.spice.outputs.aktualni == 'ano' && (steps.stav.outputs.POTREBA == 'ano' || steps.stav.outputs.POTREBA == 'ne' || github.event.inputs.nahrat_znovu == 'true') }}
        working-directory: app
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          APPKA_TOKEN: ${{ secrets.APPKA_TOKEN }}
        run: scripts/zapis-vydani.sh production

      - name: Co z toho vyšlo
        if: ${{ always() && steps.spice.outputs.aktualni == 'ano' }}
        run: |
          case "${{ steps.stav.outputs.POTREBA }}" in
            ano)
              {
                echo "### Nativní část appky se změnila"
                echo ""
                echo "Postavil se nový balíček a nahrál se do Play na track \`internal\`."
                echo "Testeři ho dostanou přes Play sami; ručně nikdo nic neinstaluje."
                echo ""
                echo "| | |"
                echo "|---|---|"
                echo "| otisk teď | \`${{ steps.stav.outputs.OTISK }}\` |"
                echo "| otisk v obchodě | \`${{ steps.stav.outputs.POSLEDNI }}\` |"
              } >> "$GITHUB_STEP_SUMMARY"
              ;;
            ne)
              echo "Nativní otisk se nezměnil, balíček do Play se nestaví — novinky jdou po síti." >> "$GITHUB_STEP_SUMMARY"
              ;;
            nevim|"")
              {
                echo "### Stav balíčku pro Play se nedal zjistit"
                echo ""
                echo "Dotaz na EAS nevyšel, takže se **neví**, co je v obchodě."
                echo "Nic se nestavělo ani nenahrávalo; příčina je v logu kroku."
                echo ""
                echo "Kdyby se build povedl a spadlo až nahrání, samo se to podruhé"
                echo "nezkusí — otisk už sedí. Cesta ven je ruční spuštění workflow"
                echo "s volbou **nahrat_znovu**."
              } >> "$GITHUB_STEP_SUMMARY"
              ;;
          esac
