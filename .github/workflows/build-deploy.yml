name: build-deploy

on:
  push:
    branches: [main]
  # Na pull requestu se testuje a zkusmo staví image, ale NIC se nikam
  # nepushuje ani nenasazuje. Recenzent tak vidí, jestli změna projde,
  # dřív než se dotkne serveru.
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      obnova:
        description: >-
          Nasadit, i když se nedá přečíst, co na produkci běží. Výslovný režim
          obnovy — bez něj se při nečitelné verzi nasazení zastaví, protože
          výpadek /verze by jinak obešel ochranu proti návratu do minulosti.
        type: boolean
        default: false

env:
  # Veřejné adresy obou služeb. Proměnná repozitáře je přebije, kdyby se
  # někdy přestěhovaly; výchozí hodnota je tu proto, aby ověření po nasazení
  # fungovalo i bez další konfigurace.
  API_URL: ${{ vars.API_URL || 'https://orlickypohar-api.klihovka.cz' }}
  WEB_URL: ${{ vars.WEB_URL || 'https://orlickypohar.klihovka.cz' }}
  IMAGE: ghcr.io/${{ github.repository }}
  IMAGE_WEB: ghcr.io/${{ github.repository }}-web
  IMAGE_LANDSAT: ghcr.io/${{ github.repository }}-landsat
  IMAGE_CACHE: ghcr.io/${{ github.repository }}-cache
  # Datum nehybné značky ve zrcadle (`.github/workflows/zrcadlo.yml`).
  # Zrcadlo vyrábí u každého obrazu značku pohyblivou i datovanou; bere se
  # **datovaná**, aby se tentýž commit postavil vždycky stejně. Když měsíční
  # přesyn ohlásí posun základního obrazu, přepíše se datum tady a ve třech
  # Dockerfilech — to je ta jediná změna, kterou přesyn stojí, a je na ní
  # vidět, kdy se základ posunul (platform/docs/KVOTY.md, nález K7).
  ZRCADLO_ZNACKA: '2026-10'

# Jedna rozdělaná sada běhů na větev. Druhý push do téže větve ten předchozí
# **zruší** — starší výsledek už nikoho nezajímá a minuty Actions jsou kvóta
# na účet, která se 10. 10. 2026 ukázala jako nejbližší zeď: 4 707 minut za
# třicet dní proti hladině 2 000 (platform/docs/KVOTY.md, nález K4). Polovina
# těch běhů byla zbytečná — na pull request se tlačí opravy po sobě a staví
# se každá.
#
# Na `main` se **neruší nic**: tam je každý běh nasazení a zrušený běh by
# znamenal verzi, která se na produkci nikdy nedostala.
#
# Tahle skupina je na workflow, zatímco job `nasazeni` má svoji vlastní
# (`nasazeni-produkce`). Nekolidují: workflow-level skupina řeší „jeden
# rozdělaný běh na větev", ta u jobu „jedno nasazení naráz přes všechny
# cesty do produkce, včetně ručního spuštění". Obě musí zůstat.
concurrency:
  group: build-deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Externí akce jsou připnuté na otisk commitu, ne na značku. Značka se dá
# přesunout, takže kdo ovládne repozitář akce, spustí si kód v tomhle CI —
# a to má právo zápisu do registru. Otisky aktualizuje Dependabot.
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      # Balíčky NuGetu z cache. Dva důvody a oba se 9. 10. 2026 ukázaly:
      #
      # 1. `api.nuget.org` nemá zveřejněný limit, ale škrtí po IP — a tu
      #    runner GitHubu **sdílí s cizími projekty**. Jeden build toho dne
      #    spadl na `Connection reset by peer`. Je to tatáž zeď jako limit
      #    Docker Hubu, jen o vrstvu dál a s horší hláškou: nevrací čistou
      #    429 s vysvětlením, ale resetnuté spojení, takže to vypadá na
      #    chybu sítě a hledá se to špatně.
      # 2. Stahování se platí minutami, a ty jsou kvóta na účet.
      #
      # Klíč je z `*.csproj`, protože `packages.lock.json` tu není. Je to
      # hrubší než lockfile (změna verze balíčku bez změny csproj se
      # nepozná), zato to nevyžaduje přepnout celé repo na lockfiles.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # Jen testy bez Dockeru: doběhnou za vteřiny a hlídají datový kontrakt,
      # tedy to nejdražší na pozdější otočení. Integrační testy běží ve
      # vedlejší úloze, která nasazení schválně neblokuje.
      #
      # Vylučujeme integrační testy značkou, ne shodou na jménu třídy —
      # nový test se tak do řetězu dostane sám a filtr se nemusí opravovat.
      - name: Testy bez Dockeru
        run: dotnet test -c Release --nologo --filter "Category!=Integracni"
        # Licence ImageSharpu: `dotnet test -c Release` ji vyžaduje stejně jako
        # publish (v Debugu je to jen varování, proto to lokálně neselže).
        env:
          SIXLABORS_LICENSE_KEY: ${{ secrets.SIXLABORS_LICENSE_KEY }}

      # Přihlášení stojí **nad** vším, co staví image, a běží i na pull
      # requestu. Základní obrazy se berou z našeho zrcadla v GHCR
      # (`.github/workflows/zrcadlo.yml`) a to je po pushi soukromé —
      # anonymní dotaz na manifest vrací 403. Dřív se tenhle krok na pull
      # requestu přeskakoval, protože se přihlášení potřebovalo jen
      # k pushi; teď je potřeba i ke čtení. Co se kam pushuje, hlídá
      # `push:` u build-push-action, ne tohle.
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pravidla mikrocache před webem proti falešnému webu: hlavně že se
      # stránka přihlášeného nikdy nedostane do cache. Když to selže,
      # nenasadí se nic — chyba tady by ukazovala cizí stránky.
      - name: Test cache
        run: deploy/cache/test/test.sh

      # Barevné tokeny: shoda webu s kopií v appce a kontrast spočítaný
      # z těch tokenů. Je to **krok v tomhle jobu, ne vlastní úloha**:
      # minuty Actions jsou nejbližší zeď hračkárny (platform/docs/KVOTY.md,
      # nález K4) a nový job by platil celý svůj start kvůli pár desítkám
      # milisekund počítání. Běží před buildem schválně — rozchod barev se
      # pozná dřív, než se postaví čtyři image.
      - name: Kontrola barevných tokenů
        run: python3 tools/kontrola-tokenu.py

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      # amd64 je výchozí cíl kvůli kompatibilitě s cizími binárkami (SDK ke kamerám,
      # nástroje výrobců, starší image). arm64 přidej, až budeš mít vedlejší ARM stroj na výpočty.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          # Na pull requestu se image jen postaví, aby se ověřil Dockerfile.
          # Do registru jde teprve po sloučení do main.
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Commit do image, ať po nasazení jde ověřit, co doopravdy běží.
          build-args: |
            VERZE=${{ github.sha }}
          # ImageSharp 4 chce licenci při publish. Jako secret, ne build-arg.
          secrets: |
            sixlabors=${{ secrets.SIXLABORS_LICENSE_KEY }}
          # `scope` musí mít **každý** build vlastní. Bez něj jde všechno do
          # klíče `buildkit` a je to zdokumentované chování buildx: *„if you
          # build multiple images, each build will overwrite the cache of the
          # previous."* Tady se takhle čtyři obrazy přepisovaly dokola —
          # index `buildkit-1-f921bd05` pro `main` měl 10. 10. 2026 verzi
          # **#1151** při 37 živých záznamech, tedy přepsaný tisíckrát.
          # Platilo se 10,6 GB blobů (limit je 10 GB **na repozitář**, takže
          # se cache trvale vytloukala) a kupovala se z nich cache pro
          # poslední ze čtyř obrazů. Nález K2 v platform/docs/KVOTY.md.
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      # Web je druhá image, ne druhý repozitář. Staví se vždycky, i když se
      # měnilo jen API — filtrování podle cest by ušetřilo minutu buildu
      # a vyměnilo ji za riziko, že se obě image rozejdou.
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta-web
        with:
          images: ${{ env.IMAGE_WEB }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./web
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          build-args: |
            VERZE=${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      # Třetí image: plánovaná úloha s teplotou hladiny ze satelitu.
      # Build zároveň ověří, že kola rasterio sedí na Python v image.
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta-landsat
        with:
          images: ${{ env.IMAGE_LANDSAT }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./jobs/landsat
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-landsat.outputs.tags }}
          labels: ${{ steps.meta-landsat.outputs.labels }}
          cache-from: type=gha,scope=landsat
          cache-to: type=gha,mode=max,scope=landsat

      # Čtvrtá image: nginx s mikrocache před webem (deploy/cache/).
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta-cache
        with:
          images: ${{ env.IMAGE_CACHE }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./deploy/cache
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-cache.outputs.tags }}
          labels: ${{ steps.meta-cache.outputs.labels }}
          cache-from: type=gha,scope=cache
          cache-to: type=gha,mode=max,scope=cache


  # Testy proti reálnému PostgreSQL přes Testcontainers. Běží VEDLE buildu,
  # ale nasazení na ně od 6. 10. 2026 ČEKÁ (oponentura): když se produkce
  # změní dřív, než je výsledek, znamená červená integrace už nasazenou
  # vadnou verzi — a přesně to se tu jednou stalo.
  #
  # Doma se pustit nedají — Docker Hub je z pracovního stroje nedostupný,
  # takže tohle je jediné místo, kde se import ověří proti databázi.
  # Appka se do žádného image nebalí, takže by se bez téhle úlohy s modelem
  # rozešla potichu: chyba překladu se nikde nespustí a pozná se až na
  # telefonu. Přesně to se stalo se stavem `Potvrzeny` — v API přibyl,
  # ve slovníku appky chyběl, a web tutéž chybu chytil jen proto, že
  # `next build` typy kontroluje.
  appka:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # `cache: 'npm'` je cache balíčků, ne Node.js — `setup-node` si ji
      # obstará sám z `package-lock.json`. Důvod je stejný jako u NuGetu:
      # `registry.npmjs.org` škrtí po IP, a tu runner sdílí s cizími
      # projekty (platform/docs/KVOTY.md, nález K3). Cesta k lockfilu se
      # musí napsat, protože appka není v korzeni repozitáře.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Závislosti appky
        run: npm ci
        working-directory: app

      - name: Typy appky proti API
        run: npx tsc --noEmit
        working-directory: app

      # Záznam trasy je jediná část appky, která smí přijít o data, když ji
      # systém zabije — testy hlídají právě to a žádnou další závislost
      # nepotřebují (SQLite dělá vestavěné `node:sqlite`).
      - name: Testy záznamu trasy
        run: npm run testy
        working-directory: app

      # Pořadí na vodě je pravidlo, ne vykreslování: dojetá loď se nesmí
      # hýbat, i když jí průmět na trať po cíli sjede. Test běží na čisté
      # funkci, takže nepotřebuje prohlížeč ani závislosti webu.
      - name: Testy pravidel webu
        run: npm run testy
        working-directory: web

  integrace:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Čtení ze zrcadla základních obrazů; zapisovat sem nemá co.
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      # Tatáž cache jako v jobu `build` a schválně se stejným klíčem: oba
      # joby restorují totéž řešení, takže se o jeden záznam dělí. Kdo
      # z nich doběhne první, ten cache uloží.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Integrační testy
        run: dotnet test -c Release --nologo --filter "Category=Integracni"
        env:
          # Licence ImageSharpu: `dotnet test -c Release` ji vyžaduje stejně jako
          # publish (v Debugu je to jen varování, proto to lokálně neselže).
          SIXLABORS_LICENSE_KEY: ${{ secrets.SIXLABORS_LICENSE_KEY }}
          # PostgreSQL ze zrcadla, ne z Docker Hubu. Lokálně se proměnná
          # nenastavuje a `PostgresFixture` sáhne na Hub jako dřív — jeden
          # vývojářský stroj limit nevyčerpá.
          POSTGRES_IMAGE: ghcr.io/${{ github.repository }}/zrcadlo/postgres:17-alpine-${{ env.ZRCADLO_ZNACKA }}
          # Ryuk uklízí kontejnery po skončení testů a tahá se taky z Hubu.
          # Na runneru, který se po běhu zahodí celý, není co uklízet.
          # Schválně jen tady, ne v kódu: lokálně uklízet potřeba je.
          TESTCONTAINERS_RYUK_DISABLED: 'true'

  # Nasazení. Vlastní úloha, ne poslední krok buildu, a to ze tří důvodů:
  #
  # 1. **Čeká na testy.** Dokud byl deploy krokem buildu, běžel vedle
  #    integrace — červená integrace tak mohla znamenat už nasazenou vadnou
  #    verzi, protože produkce se změnila dřív, než byl výsledek.
  # 2. **Jedno nasazení naráz.** Skupina souběhu platí pro všechny cesty do
  #    produkce, tedy i pro ruční spuštění. `cancel-in-progress: false`
  #    schválně: rozdělaný deploy se nepřeruší, další počká.
  # 3. **Nevrací produkci do minulosti.** Fronta sama nestačí — GitHub řadí
  #    podle okamžiku vstupu do skupiny, ne podle stáří commitu, takže
  #    pozdě doběhlý starý build se zařadí za novější. Proto se před
  #    odesláním čte, co na produkci běží, a starší commit se neposílá.
  nasazeni:
    needs: [build, appka, integrace]
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    concurrency:
      group: nasazeni-produkce
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Celá historie: bez ní nejde říct, jestli je běžící commit
          # potomkem toho nasazovaného, tedy novější.
          fetch-depth: 0

      # Prázdná `DEPLOY_WEBHOOK` dávala **zelený běh, nedotčenou produkci
      # a nulovou stopu** (audit 8. 10. 2026). Byl to nejhorší možný tvar
      # poruchy: ochrana proti návratu do minulosti ze 6. 10. 2026 na něj
      # mlčí, protože ta hlídá, *co* se nasazuje, ne *jestli* se nasazuje.
      #
      # Stojí to první, ještě než se čte produkce: job, který nemá kam
      # nasadit, nemá co dělat ani kontroly.
      - name: Je kam nasadit
        run: |
          if [ -z "${{ vars.DEPLOY_WEBHOOK }}" ]; then
            echo "::error::Proměnná DEPLOY_WEBHOOK je prázdná, takže se nemá kam nasadit."
            echo "Dokud chybí, byl by běh zelený a produkce by se nehnula."
            echo "Doplň ji v nastavení repozitáře (Settings → Secrets and variables → Actions → Variables)."
            exit 1
          fi
          echo "DEPLOY_WEBHOOK je nastavená."

      # Co na produkci běží teď. Tenhle krok sám nepadá (`|| true`), protože
      # rozhodnutí patří kroku „Nevracet produkci do minulosti" pod ním:
      # nečitelná verze nasazení **zastaví** a cesta ven je ruční spuštění
      # s `obnova = true` (zdůvodnění tam, 6. 10. 2026).
      - name: Co běží na produkci
        id: bezi
        run: |
          api=$(curl -fsS --max-time 20 "$API_URL/verze" 2>/dev/null \
            | python3 -c "import json,sys; print(json.load(sys.stdin).get('verze',''))" 2>/dev/null || true)
          echo "sha=$api" >> "$GITHUB_OUTPUT"
          echo "Na produkci běží API: ${api:-neznámá}"

      # Jádro ochrany: nasazovaný commit nesmí být předkem toho běžícího.
      # Když je, je běžící verze novější a tenhle build dorazil pozdě.
      - name: Nevracet produkci do minulosti
        id: kontrola
        run: |
          bezi='${{ steps.bezi.outputs.sha }}'
          obnova='${{ inputs.obnova }}'

          # Nečitelná verze ochranu neobchází. Výpadek `/verze` by jinak
          # stačil k tomu, aby starý build přepsal produkci — a vypadalo by
          # to jako obyčejné nasazení (oponentura, 6. 10. 2026).
          #
          # Cesta ven je výslovná: spustit znovu ručně s `obnova = true`.
          # Je to i cesta pro případ, kdy produkce neodpovídá právě proto,
          # že je rozbitá a nasadit se musí.
          if [ -z "$bezi" ] || ! git cat-file -e "$bezi^{commit}" 2>/dev/null; then
            duvod="Nedá se přečíst, co na produkci běží"
            [ -n "$bezi" ] && duvod="Produkce hlásí verzi $bezi, která v historii není"
            if [ "$obnova" = "true" ]; then
              echo "::warning::$duvod. Běží režim obnovy, nasazuje se."
              echo "nasadit=ano" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::$duvod, takže nejde ověřit, že tenhle build není starší."
            echo "Spusť build-deploy ručně nad main s volbou obnova, pokud to tak má být."
            exit 1
          fi
          if [ "$bezi" = "${{ github.sha }}" ]; then
            echo "Na produkci už běží tenhle commit, nasazuje se znovu."
            echo "nasadit=ano" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git merge-base --is-ancestor "${{ github.sha }}" "$bezi"; then
            echo "::warning::Na produkci běží novější commit ($bezi)." \
              "Tenhle build (${{ github.sha }}) je jeho předek a nasazením by" \
              "produkci vrátil do minulosti. Přeskakuje se."
            echo "nasadit=ne" >> "$GITHUB_OUTPUT"
          else
            echo "nasadit=ano" >> "$GITHUB_OUTPUT"
          fi

      # Server si novou image stáhne sám. Posílá se i compose ze STEJNÉHO
      # commitu, ze kterého je image — jinak by se nasadila nová aplikace
      # se starým nastavením a chybějící tajemství by se projevilo až za běhu.
      #
      # Tajemství jde hlavičkou, ne v URL: adresa se objevuje v logu běhu.
      #
      # `X-Deploy-Sha` a `X-Deploy-Poradi` jsou pro server: tutéž kontrolu
      # dělá ještě jednou **pod svým zámkem**, takže mezi ni a nasazení se
      # nevejde druhý build. Ta zdejší běží mimo zámek a zavírá jen naše
      # vlastní cesty (`platform#7`). Pořadí je čas commitu v sekundách —
      # háček repozitář nemá a předka od potomka sám nepozná.
      #
      # `X-Deploy-Obnova` posílá výslovné vrácení na starší build dál, aby
      # ho server neodmítl: tady už je rozhodnuté, že se tak stát má.
      - name: Deploy
        if: ${{ steps.kontrola.outputs.nasadit == 'ano' }}
        run: |
          poradi=$(git log -1 --format=%ct "${{ github.sha }}")
          echo "Posílám ${{ github.sha }}, čas commitu $poradi."
          curl -fsS --max-time 900 -X POST "${{ vars.DEPLOY_WEBHOOK }}" \
            -H "X-Deploy-Token: ${{ secrets.DEPLOY_TOKEN }}" \
            -H "X-Deploy-Sha: ${{ github.sha }}" \
            -H "X-Deploy-Poradi: $poradi" \
            -H "X-Deploy-Obnova: ${{ inputs.obnova == true && 'ano' || 'ne' }}" \
            -H "Content-Type: application/yaml" \
            --data-binary @deploy/docker-compose.yml

      # `Healthy` a HTTP 200 vrací i verze, která tam visí z minula, takže
      # samy o sobě nedokazují nic. Porovnává se skutečná verze obou služeb.
      #
      # Čeká se omezeně (20 × 15 s) a pak se **musí** vědět. Neověřený
      # výsledek končí chybou, i po obnově: zelená nad službou, o které
      # nevíme, co na ní běží, je falešná jistota.
      - name: Ověřit, co doopravdy běží
        if: ${{ steps.kontrola.outputs.nasadit == 'ano' }}
        run: |
          ocekavano='${{ github.sha }}'
          chyba=0
          for i in $(seq 1 20); do
            api=$(curl -fsS --max-time 20 "$API_URL/verze" 2>/dev/null \
              | python3 -c "import json,sys; print(json.load(sys.stdin).get('verze',''))" 2>/dev/null || true)
            web=$(curl -fsS --max-time 20 "$WEB_URL/verze" 2>/dev/null \
              | python3 -c "import json,sys; print(json.load(sys.stdin).get('verze',''))" 2>/dev/null || true)
            [ "$api" = "$ocekavano" ] && [ "$web" = "$ocekavano" ] && break
            sleep 15
          done
          echo "čekáno: $ocekavano"
          echo "API:    ${api:-neodpovědělo}"
          echo "web:    ${web:-neodpovědělo}"

          # Neověřený výsledek je chyba, ne varování. Zelená úloha nad
          # službou, o které nevíme, co na ní běží, je falešná jistota —
          # a platí to dvojnásob po obnově, kde se nasazovalo právě proto,
          # že se verze přečíst nedala (oponentura, 6. 10. 2026).
          [ -n "$api" ] || { echo "::error::API po nasazení verzi nevydalo."; chyba=1; }
          [ -n "$web" ] || { echo "::error::Web po nasazení verzi nevydal."; chyba=1; }
          [ -z "$api" ] || [ "$api" = "$ocekavano" ] \
            || { echo "::error::API běží na jiné verzi."; chyba=1; }
          [ -z "$web" ] || [ "$web" = "$ocekavano" ] \
            || { echo "::error::Web běží na jiné verzi."; chyba=1; }
          exit $chyba
