# Nasazení aplikace na server. Leží v /opt/apps/<projekt>/ vedle secrets/.
# Sdílené služby (Traefik, PostgreSQL) běží ze stacku v platform repu.
#
#   export APP_NAME=rezervace PLATFORM_DOMAIN=tvoje-domena.cz
#   export IMAGE=ghcr.io/file-pb/rezervace:latest
#   docker compose up -d

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

networks:
  edge: { name: edge, external: true }     # k Traefiku
  data: { name: data, external: true }     # k databázi
  # Vlastní síť projektu, aby web mluvil s API.
  #
  # POZOR: vlastní síť sama nestačí. Web je zapojený i v `edge` a Docker
  # jména ze všech sítí kontejneru slučuje — jméno `app` se tak překládalo
  # na orlickypohar-app i na telemetrie-app. Ověřeno 15. 9. 2026 na
  # produkci: z šesti dotazů webu na app:8080 skončilo pět 404 od telemetrie
  # a web ukazoval ročník jako neexistující, dokud ho někdo nerestartoval.
  # API proto dostává ve vnitřní síti vlastní jméno (níž), které nikde jinde
  # neexistuje.
  interni: { internal: true }
  # Cesta ven pro web (data ČHMÚ, Povodí…) a plánovanou úlohu (katalog
  # Landsatu). `interni` ven nepustí a `edge` patří Traefiku — ani jeden
  # z nich nemá být vidět zvenku ani přes něj.
  ven: {}

services:
  app:
    image: ${IMAGE:?Nastav IMAGE na tag z GHCR}
    restart: unless-stopped
    logging: *logging
    networks:
      edge: {}
      data: {}
      interni:
        aliases: [orlickypohar-api]
    environment:
      # Běžná konfigurace v prostředí, tajemství v secrets níž.
      Serilog__WriteTo__1__Name: "Seq"
      Serilog__WriteTo__1__Args__serverUrl: "http://seq"
      # Poskytovatel identity. Tohle jsou jediné dvě věci, které o něm
      # aplikace ví — adresa a vlastní identifikátor u něj. Ani jedno není
      # tajemství: obojí stojí ve veřejném OIDC dokumentu, respektive
      # v adrese, kterou prohlížeč stejně uvidí.
      #
      # Bez nich se ověřování nezapne a chráněné endpointy se nezaregistrují
      # vůbec — zapomenutá proměnná není totéž co otevřený endpoint.
      Identita__Authority: "https://ucty.${PLATFORM_DOMAIN:?}"
      # Klientů je víc než jeden: web a appka mají u poskytovatele každý
      # svou aplikaci, takže i svoje `aud` v tokenu. Oddělují se čárkou.
      # Appka tu zatím není — čeká na založení aplikace typu Native
      # (návratová adresa `orlickypohar://prihlaseni`, Auth Token Type JWT).
      Identita__Audience: "390035493066113030"
      # Úložiště fotek (Cloudflare R2 přes S3 protokol). Endpoint obsahuje
      # číslo účtu u Cloudflaru, proto leží v .env vedle tohohle souboru,
      # ne tady. Bez něj, nebo s prázdnými klíči, aplikace naběhne a jen
      # nenabízí nahrávání — fotky nejsou důvod, proč by neměly jít výsledky.
      Fotky__Endpoint: "${FOTKY_ENDPOINT:-}"
      Fotky__Bucket: "orlickypohar-fotky"
      # Sběr vodočtu Orlíku z Povodí Vltavy každých deset minut. Jen tady —
      # testy a vývoj na cizí server nesahají.
      Vodocet__Sber: "true"
      # Přebírání novinek z cizích kanálů (dnes svaz), nejnovější od každého
      # zdroje. Jen tady, ze stejného důvodu jako vodočet — na cizí server
      # sahá jen nasazení.
      Prevzate__Sber: "true"
      # Fotku k přejatému článku si uložíme k sobě a přepočítáme na naše
      # velikosti. Vypnutím se uložené fotky při dalším běhu samy smažou
      # a web se vrátí k adrese u zdroje — tak se vypíná i dohoda, která
      # by přestala platit.
      Prevzate__Fotky: "true"
      # Kontakty kapitánů se jednou denně mažou po konci následující sezóny.
      Kontakty__Uklid: "true"
      # Vlastní doména na bucketu. Jednoúrovňová, ze stejného důvodu jako API.
      Fotky__VerejnaAdresa: "https://${APP_NAME}-foto.${PLATFORM_DOMAIN:?}"
      # Co provoz a servis stojí — obrazovka pro správce webu. Čísla počítá
      # přehled stavu platformy, aplikace je jen čte. Bez téhle proměnné se
      # obrazovka nevypne, jen řekne, že čísla nejsou.
      Naklady__Soubor: "/data/platforma/naklady.json"
    volumes:
      # Náklady, které do adresáře projektu kopíruje přehled platformy
      # (platform/scripts/prehled-stav.sh, KOPIE_NAKLADU).
      #
      # **Cesta musí ležet pod /opt/apps/<projekt>.** Nasazovací háček odmítne
      # compose, který připojuje cokoliv jiného — a odmítne ho dřív, než něco
      # nasadí, takže by neprošel ani zbytek pushe. Přímý mount /opt/platform
      # proto nejde a je to tak správně.
      #
      # Jen ke čtení a schválně **adresář, ne ten jeden soubor**: soubor se
      # přepisuje přes dočasný a `mv`, tedy nový inode. Bind mount souboru by
      # držel ten původní a kontejner by do konce života viděl čísla z chvíle,
      # kdy nastartoval.
      - /opt/apps/${APP_NAME}/stav:/data/platforma:ro
    secrets:
      - ConnectionStrings__Postgres
      - Import__Token
      - Landsat__Token
      - Fotky__KlicId
      - Fotky__Klic
    labels:
      # Výměna bez výpadku: nový kontejner nabíhá vedle starého a starý se
      # zastaví teprve, až je nový zdravý (platform/deploy-hook/README.md).
      # Změřeno 10. 10. 2026, že bez toho je každé nasazení pro návštěvníka
      # 25,7 s rozbitého API. Podmínkou je, že po dobu výměny běží stará i nová verze
      # proti jedné databázi — migrace proto přidávají, neruší.
      platforma.nasazeni: bez-vypadku
      # POZOR: Compose dosazuje proměnné jen do HODNOT, ne do klíčů.
      # Jméno routeru proto musí být napevno a unikátní napříč všemi
      # aplikacemi na serveru — přejmenuj ho spolu s projektem.
      traefik.enable: "true"
      traefik.docker.network: edge
      # API má vlastní subdoménu; hezká adresa patří webu, ne rozhraní.
      # POZOR na tvar jména: bezplatný certifikát Cloudflare pokrývá jen
      # *.domena.cz, tedy JEDNU úroveň. Na api.projekt.domena.cz by TLS
      # selhalo dřív, než požadavek dojde na server.
      traefik.http.routers.orlickypohar.rule: Host(`${APP_NAME}-api.${PLATFORM_DOMAIN:?}`)
      traefik.http.routers.orlickypohar.tls.certresolver: le
      # Omezení rychlosti a hlavičky ze sdílené konfigurace platformy.
      # Tohle je veřejný web, kde drtivá většina provozu je čtení výsledků —
      # proto standardní strop, ne přísný zapisovací jako u telemetrie.
      traefik.http.routers.orlickypohar.middlewares: "ratelimit-standard@file,bezpecne-hlavicky@file"
      traefik.http.services.orlickypohar.loadbalancer.server.port: "8080"
      # Traefik posílá provoz jen na kontejner, který prošel readiness —
      # když spadne databáze, vrací čisté 503 místo rozbitých odpovědí.
      #
      # Timeout ale MUSÍ být delší než výchozích 5 s. Traefik vyřadí server
      # po JEDINÉM neúspěšném pokusu a replika je jedna — přetížená aplikace,
      # která jen pomalu odpovídá, by se změnila v úplný výpadek. Webu se to
      # stalo při zátěžovém testu 21. 9. 2026 (platform/docs/POUCENI.md, 44).
      # unhealthyInterval: po vyřazení to zkusí hned znovu, ať planý poplach
      # trvá vteřiny, ne celý interval.
      traefik.http.services.orlickypohar.loadbalancer.healthcheck.path: /health/ready
      traefik.http.services.orlickypohar.loadbalancer.healthcheck.interval: 10s
      traefik.http.services.orlickypohar.loadbalancer.healthcheck.timeout: 10s
      traefik.http.services.orlickypohar.loadbalancer.healthcheck.unhealthyInterval: 3s
    deploy:
      resources:
        limits: { memory: 512m, cpus: "1.0" }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 15s
      # Velkoryse, ze stejného důvodu jako u Traefiku: nezdravý kontejner
      # Traefik vyřadí i podle téhle kontroly. Zaseklá aplikace se pozná
      # do dvou minut, přetížená nemá vypadnout. Poučení 44.
      timeout: 10s
      retries: 5
      start_period: 20s

  # Dvě repliky webu, a liší se jen síťovým aliasem. Druhá dědí přes
  # kotvu `*web-sluzba` celé prostředí i limity — schválně, protože
  # vynechaná proměnná prostředí je u druhé kopie webu nejčastější chyba
  # (poučení 54). Vypsat ji podruhé ručně znamená, že se jednou rozejdou.
  web: &web-sluzba
    image: ${IMAGE_WEB:?Nastav IMAGE_WEB na tag z GHCR}
    restart: unless-stopped
    logging: *logging
    # Zvenku se na web chodí jen přes `cache` (níž), proto už není v `edge`.
    # Alias jako u API: jméno, které nikde jinde neexistuje.
    networks:
      interni:
        aliases: [orlickypohar-web]
      ven: {}
    environment:
      # Interní adresa, ne veřejná. Přes internet by to byla zbytečná cesta
      # ven a zpátky přes Traefik. Jméno `orlickypohar-api`, ne `app` —
      # `app` je na sdílené síti `edge` i telemetrie, viz `networks` nahoře.
      API_URL: "http://orlickypohar-api:8080"
      # Ročníky s vymyšlenými výsledky. Web u nich ukáže pruh, že data nejsou
      # skutečná. Až se ukazovat přestanou, stačí smazat tenhle řádek.
      UKAZKOVE_SERIE: "2026-nanecisto"
      # Poslední build appky. Každý build má jinou adresu, takže se to mění
      # tady, ne v kódu — `npm run apk` v app/ vypíše novou.
      APK_URL: "https://expo.dev/artifacts/eas/AUc27sP0kkXRAzZWvgjjPu0GG9_ty9xwPcB6DnGDuXc.apk"
      # Přihlašování. Tytéž dvě hodnoty jako u API a k tomu veřejná adresa
      # webu, ze které se skládá návratová cesta — ta musí přesně souhlasit
      # s tím, co je zapsané u aplikace v Zitadelu, jinak poskytovatel kód
      # nevydá. Bez těchhle proměnných se přihlašování nikde nenabízí.
      IDENTITA_AUTHORITY: "https://ucty.${PLATFORM_DOMAIN:?}"
      IDENTITA_CLIENT_ID: "390035493066113030"
      WEB_URL: "https://${APP_NAME}.${PLATFORM_DOMAIN:?}"
      # Kam vede „Účet a heslo" v profilové nabídce. Samoobsluha
      # poskytovatele: heslo, e-mail, druhý faktor. Adresa je tady, a ne
      # v kódu, aby výměna poskytovatele neznamenala změnu webu.
      IDENTITA_UCET_URL: "https://ucty.${PLATFORM_DOMAIN:?}/ui/console/users/me"
      # Adresa pro žádosti o osobní údaje (výpis, oprava, výmaz). Ukáže se
      # na stránce /osobni-udaje. Prázdná znamená, že stránka o adrese mlčí
      # a pošle čtenáře za pořadatelem regaty — mlčet je lepší než napsat
      # adresu, která nikomu nechodí.
      KONTAKT_UDAJE: ""
    labels:
      # Výměna bez výpadku: nový kontejner nabíhá vedle starého a starý se
      # zastaví teprve, až je nový zdravý (platform/deploy-hook/README.md).
      # Změřeno 10. 10. 2026, že bez toho je každé nasazení pro návštěvníka
      # 22,3 s rozbitého webu. Podmínkou je, že po dobu výměny běží stará i nová verze
      # proti jedné databázi — migrace proto přidávají, neruší.
      platforma.nasazeni: bez-vypadku
    deploy:
      resources:
        limits: { memory: 512m, cpus: "1.0" }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 15s
      # Velkoryse: zaseklá aplikace se pozná do dvou minut, přetížená nemá
      # vypadnout. Poučení 44.
      timeout: 10s
      retries: 5
      start_period: 20s

  # Replika jen pro přihlášené. Kdo má cookie sezení, jde vždycky mimo cache,
  # takže každý jeho požadavek je vykreslení — a na společné replice se
  # zařadí do fronty za útočníkem, který si vyžádal vykreslení na stále
  # nové adresy (`?x=N`). Nález S11 v platformě.
  #
  # Změřeno 9. 10. 2026 při tom floodu: přihlášený na společné replice
  # **1,9 s**, na vlastní **0,20 s**, tedy stejně jako v klidu. Replika
  # přitom zůstala na 4 % procesoru, takže se dvoujádrový stroj nevytíží
  # dvakrát — flood se celý zavře do anonymní repliky.
  #
  # Rozdělení dělá nginx (`$web_replika` v deploy/cache/default.conf),
  # ne Docker: žádný sdílený alias. Sdílený alias není měřicí přípravek
  # ani rozdělení, je to střídání (poučení 54).
  web-sezeni:
    <<: *web-sluzba
    networks:
      interni:
        aliases: [orlickypohar-web-sezeni]
      ven: {}

  # Mikrocache před webem (deploy/cache/, důvody v default.conf): stránku
  # pro nepřihlášené vykreslí web nejvýš jednou za 10 s. Veřejná adresa
  # webu vede sem; přihlášení a správa projdou k webu beze změny.
  # Pravidla hlídá deploy/cache/test/test.sh v CI před nasazením.
  cache:
    image: ${IMAGE_CACHE:-ghcr.io/file-pb/orlickypohar-cache:latest}
    restart: unless-stopped
    logging: *logging
    networks: [edge, interni]
    labels:
      # Výměna bez výpadku: nový kontejner nabíhá vedle starého a starý se
      # zastaví teprve, až je nový zdravý (platform/deploy-hook/README.md).
      # Změřeno 10. 10. 2026, že bez toho je každé nasazení pro návštěvníka
      # 22,3 s bez adresy (Traefik ztratí router). Podmínkou je, že po dobu výměny běží stará i nová verze
      # proti jedné databázi — migrace proto přidávají, neruší.
      platforma.nasazeni: bez-vypadku
      # Jména routeru a služby zůstala po webu — adresa se nemění.
      traefik.enable: "true"
      traefik.docker.network: edge
      traefik.http.routers.orlickypohar-web.rule: Host(`${APP_NAME}.${PLATFORM_DOMAIN:?}`)
      traefik.http.routers.orlickypohar-web.tls.certresolver: le
      traefik.http.routers.orlickypohar-web.middlewares: "ratelimit-standard@file,bezpecne-hlavicky@file"
      traefik.http.services.orlickypohar-web.loadbalancer.server.port: "8080"
      # Zdraví nginxu samotného, ne webu: pomalý web nesmí vyřadit
      # ze směrování i cache, která by mezitím dál rozdávala stránky.
      # Timeouty jako všude jinde (poučení 44).
      traefik.http.services.orlickypohar-web.loadbalancer.healthcheck.path: /cache-zdravi
      traefik.http.services.orlickypohar-web.loadbalancer.healthcheck.interval: 15s
      traefik.http.services.orlickypohar-web.loadbalancer.healthcheck.timeout: 10s
      traefik.http.services.orlickypohar-web.loadbalancer.healthcheck.unhealthyInterval: 3s
    deploy:
      resources:
        limits: { memory: 128m, cpus: "0.5" }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/cache-zdravi"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 5s


  # Plánovaná úloha (typ `scheduled-job` na platformě): jednou denně spočítá
  # teplotu hladiny z Landsatu a pošle ji do API. Žádný port, žádný Traefik.
  # Smyčka je uvnitř, ne v cronu hostitele, aby se celá úloha popsala tady
  # a přestěhovala se s compose. Po restartu počítá hned — zápis je
  # idempotentní, takže nasazení nic nezdvojí.
  landsat:
    image: ${IMAGE_LANDSAT:-ghcr.io/file-pb/orlickypohar-landsat:latest}
    restart: unless-stopped
    logging: *logging
    networks: [interni, ven]
    # Úloha se hned po startu ptá API na poslední snímek. Bez čekání na
    # zdravé API dostala při nasazení „Connection refused" (18. 9. 2026)
    # a další pokus by byl až za hodinu.
    depends_on:
      app: { condition: service_healthy }
    environment:
      API_URL: "http://orlickypohar-api:8080"
      HODINA_UTC: "13"
    secrets:
      - Landsat__Token
    deploy:
      resources:
        limits: { memory: 384m, cpus: "0.5" }

secrets:
  # Vyrobí ho scripts/new-project.sh v platform repu; sem se jen zkopíruje.
  ConnectionStrings__Postgres:
    file: ./secrets/ConnectionStrings__Postgres
  # Sdílené tajemství pro nahrání ročníku. Dokud neexistuje identita (fáze 4),
  # je to jediná ochrana zápisu. Když soubor chybí, import vrací 503 —
  # nenakonfigurovaný token neznamená otevřený endpoint.
  Import__Token:
    file: ./secrets/Import__Token
  # Klíč k bucketu `orlickypohar-fotky`, jen Object Read & Write a jen na něj.
  # Soubory musí existovat i prázdné, jinak kontejner nenaběhne; prázdné
  # znamenají „nahrávání vypnuté".
  # Zápis teploty ze satelitu. Zvlášť od importního tokenu: úloha smí
  # zapsat teploty, ne přepsat ročník. Sdílí ho API a úloha `landsat`.
  Landsat__Token:
    file: ./secrets/Landsat__Token
  Fotky__KlicId:
    file: ./secrets/Fotky__KlicId
  Fotky__Klic:
    file: ./secrets/Fotky__Klic
