# Mikrocache HTML před webem (Filip, 22. 9. 2026).
#
# Proč: web je celý `force-dynamic` (hlavička nese přihlášeného) a unese
# ~4 stránky za vteřinu. Po doběhnutí rozjížďky se ~160 lidí podívá na
# výsledky během pár vteřin. Tady se stránka pro nepřihlášené vykreslí
# nejvýš jednou za 10 s na adresu a vzhled, ať přijde lidí kolik chce.
# Rozhodnutí a měření: platform/docs/ARCHITEKTURA.md, *Cache a očekávaná
# zátěž*; S11 v platform/docs/BEZPECNOST-PLAN.md.
#
# NEJDŮLEŽITĚJŠÍ PRAVIDLO: stránka přihlášeného nesmí nikdy do cache.
# Pozná se podle cookie sezení (`op_token`, dělená `op_token.N`, `op_tok`
# — jména jsou ve web/lib/oidc.ts). Přejmenuješ-li je tam, přejmenuj je
# i tady, jinak přihlášený uvidí anonymní stránku. Cizí profil neuvidí
# nikdo ani pak: odpověď se `Set-Cookie` se neukládá a test v CI
# (deploy/cache/test/) to hlídá.
#
# Soubor patří do http kontextu (image ho vkládá z /etc/nginx/conf.d/).

log_format json escape=json
  '{"cas":"$time_iso8601","metoda":"$request_method","cesta":"$request_uri",'
  '"stav":$status,"cache":"$upstream_cache_status","ms":$request_time,'
  '"web_ms":"$upstream_response_time","bajtu":$body_bytes_sent}';

# Paměť jen na disku kontejneru — nic autoritativního, po restartu prázdná.
proxy_cache_path /var/cache/nginx/stranky levels=1:2 keys_zone=stranky:10m
                 max_size=256m inactive=10m use_temp_path=off;

# Cookie sezení → mimo cache. Stačí přítomnost, platnost řeší web: i cookie
# s propadlým tokenem je vlastní stav hlavičky (web/app/layout.tsx).
map $http_cookie $sezeni {
  default "";
  "~(^|;)\s*op_tok(en)?(\.[0-9]+)?=" 1;
}

# Vzhled je v klíči cache, ale jen platné hodnoty (web/lib/rezim.ts).
# Cokoliv jiného web ignoruje stejně jako chybějící cookie — a vymyšlené
# hodnoty by jinak každá vyrobila vlastní vykreslení.
map $cookie_op_rezim $rezim {
  default "";
  svetly  svetly;
  tmavy   tmavy;
}

# Kdo je klient. Traefik posílá `Cf-Connecting-Ip` dál beze změny a podle
# téže hlavičky počítá svůj `ratelimit-standard`, takže obojí mluví o témže.
# `$remote_addr` by tu byl k ničemu: pro nginx je to IP Traefikova
# kontejneru, takže by se všichni návštěvníci počítali jako jeden.
map $http_cf_connecting_ip $klient {
  ""      $remote_addr;   # zevnitř sítě (test, monitoring) — ať klíč není prázdný
  default $http_cf_connecting_ip;
}

# Požadavky, které jdou MIMO cache, tedy vždycky vykreslují. Pro ostatní je
# klíč prázdný a nginx tuhle zónu přeskočí.
map "$sezeni:$http_rsc:$http_authorization" $klient_render {
  "::"    "";
  default $klient;
}

# Změřeno 8. 10. 2026 (platform/docs/ARCHITEKTURA.md): web zvládne ~4,9
# vykreslení za vteřinu a jeden klient s **neplatnou** cookie sezení ho sám
# srazí na 100 % procesoru — Traefikův limit 30/s je nad kapacitou, takže
# nezasáhne. Mikrocache nápor diváků pohltí, obcházející cesty ne.
#
# Dvě směrnice, každá na jinou polovinu problému:
# Parametr, který aplikace nezná, vyrábí pokaždé nový klíč cache — tedy
# vykreslení, které se nikdy nikomu nehodí. Měřeno 9. 10.: takový flood
# drží celou kapacitu webu, protože je *cachovatelný* a do zóny `render`
# nespadne.
#
# Seznam je schválně **široký** (čte se z kódu webu plus běžné příchozí
# značky jako `fbclid`): tohle je limit, ne klíč cache. Zapomenutý parametr
# tu znamená škrcení na 2/s, kdežto v klíči cache by znamenal cizí obsah
# ve stránce. Proto se to dělá tady a ne tam.
#
# **Co to nezastaví:** útočníka, který vezme známé jméno (`?stav=1`,
# `?stav=2`, …). Na to je potřeba kapacita, ne limit — viz ARCHITEKTURA.md.
map $args $neznamy_arg {
  default 0;
  "~(^|&)(?!(?:autor|boje|chyba|cislo|code|cookie|datum|druh|duvod|email|error|fbclid|gclid|id|kalendar|kam|kdo|klic|kod|kotva|lod|lode|na|narok|nastav|navrh|nazev|popis|poradatel|poznamka|prenastav|prijmout|proc|publikovano|referer|revize|role|serie|slug|soubor|souhlas|souradnice|state|stav|telo|titulek|trida|utm_campaign|utm_content|utm_medium|utm_source|utm_term|uzivatel|vazba|verze|vlozene|zadost|zaplaceno|zavod|zpet)=)[^=&]+=" 1;
}

map $neznamy_arg $klient_divny {
  0 "";
  1 $klient;
}

limit_req_zone  $klient_divny  zone=divny:10m  rate=2r/s;   # neznámé parametry
limit_req_zone  $klient_render zone=render:10m rate=2r/s;   # vykreslování na klienta
limit_req_zone  $klient        zone=sprava:10m rate=10r/s;  # správa — potřebuje víc, viz níž
limit_conn_zone $klient        zone=souben:10m;             # souběh na klienta

server {
  listen 8080;
  server_tokens off;

  # Odmítnutí limitem musí jít v měření odlišit od přetížení: nginx posílá
  # ve výchozím stavu 503, což je totéž, co vrací přetížený web i Traefik
  # při vyřazení kontejneru (poučení 44). 429 říká „je tě moc", ne „je zle".
  limit_req_status  429;
  limit_conn_status 429;
  limit_req_log_level warn;

  # Souběh na klienta. Prohlížeč otevírá nejvýš kolem šesti spojení na doménu,
  # takže osm je nad potřebou člověka a zároveň strop pro útok: web je
  # jednovláknový, takže o jeho čas se nemá prát jeden klient se všemi.
  # Platí i na cachované požadavky — ty jsou levné, ale fronta u nich není.
  limit_conn souben 8;
  access_log /dev/stdout json;

  # Formulář správy posílá fotku z telefonu; web bere 16 MB
  # (web/next.config.ts), nginx by jinak odmítl nad 1 MB.
  client_max_body_size 20m;

  # Web se překládá za běhu, ne při startu: při nasazení dostane kontejner
  # webu novou adresu a pevně přeložené jméno by vedlo do prázdna, dokud
  # by se nginx nerestartoval. 127.0.0.11 je DNS Dockeru.
  # `orlickypohar-web` je alias ve vlastní síti projektu — jméno `web` je
  # na sdílené síti `edge` i u jiných projektů (poučení 38).
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $web http://orlickypohar-web:8080;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header Connection "";
  # Hlavičky od Traefiku jdou dál beze změny (Cf-Connecting-Ip taky).
  proxy_set_header X-Forwarded-For $http_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
  # Web má posílat nekomprimované — jinak by se do cache uložila gzip
  # verze a dostal ji i klient, který gzip neumí. Komprimuje nginx.
  proxy_set_header Accept-Encoding "";
  proxy_read_timeout 30s;

  gzip on;
  gzip_types text/css application/javascript application/json text/x-component image/svg+xml;
  gzip_min_length 1024;
  gzip_vary on;

  # Zdraví samotného nginxu pro Traefik a Docker. Schválně se neptá webu:
  # pomalý web nesmí nginx vyřadit ze směrování (poučení 44).
  location = /cache-zdravi {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Zdraví webu projde až k němu, nikdy z cache — monitoring zvenku
  # (Uptime Kuma) se ptá na tohle a musí poznat, když web spadne.
  location = /health {
    access_log off;
    proxy_pass $web;
  }

  # Přihlášení, odhlášení, správa a přepínač vzhledu nastavují cookie
  # nebo patří přihlášenému. Mimo cache celé, i kdyby cookie chyběla.
  location ~ ^/(prihlaseni|odhlaseni|sprava|rezim)(/|$) {
    # Správa má vlastní, volnější strop. Dva důvody:
    #
    # 1. Cílová obrazovka zapisuje v dojezdech souvisle. Klepnutí se slučují
    #    (`bezi.current` v cil.tsx), ale smyčka `while (znovu.current)` jede,
    #    dokud se klepe — tempo tedy určuje doba odezvy, ne prst, a při
    #    stovce milisekund to je kolem pěti požadavků za vteřinu. Přísný
    #    strop by zapisovateli uprostřed dojezdů vrátil 429, obrazovka by
    #    přepnula na „chyba" a zkusila to až za třicet vteřin.
    # 2. Anonymní nápor sem je levný: od `0ad29a9` má celá správa
    #    `RequireAuthorization()`, takže nepřihlášený dostane 401 **dřív
    #    než se cokoliv vykreslí**. Drahá cesta pro útočníka je veřejná
    #    stránka s cookie, co vypadá jako sezení — tu drží zóna `render`.
    #
    # Souběh (`limit_conn 8`) platí i tady, takže strop existuje tak jako tak.
    limit_req zone=sprava burst=30 nodelay;
    proxy_pass $web;
  }

  location / {
    # Jen pro požadavky mimo cache (viz `$klient_render`). Dvě za vteřinu
    # s dávkou deseti pokryjí člověka, který kliká a kterému Next prefetchuje
    # odkazy; útočníkovi to strop drží pod kapacitou webu, takže zbyde na
    # ostatní. Cachované požadavky sem nespadnou — mají prázdný klíč.
    limit_req zone=render burst=10 nodelay;
    limit_req zone=divny  burst=5  nodelay;
    proxy_pass $web;

    proxy_cache stranky;
    # Vzhled v klíči: světlá, tmavá a systémová stránka se liší v `<html
    # data-rezim>`. Adresa celá i s parametry (?trida=, ?kalendar=) —
    # vynechaný parametr by ukázal jinou stránku.
    proxy_cache_key "$host$request_uri|$rezim";
    proxy_cache_valid 200 404 10s;
    # Next posílá u dynamických stránek `Cache-Control: no-store` a `Vary`
    # s hlavičkami RSC — obojí je určené prohlížeči a jde k němu beze
    # změny; nginx se jím neřídí. RSC požadavky jdou mimo cache níž.
    # `Set-Cookie` tu schválně NENÍ: odpověď, která nastavuje cookie,
    # se neuloží.
    proxy_ignore_headers Cache-Control Expires Vary;

    # Mimo cache: sezení, RSC požadavky Next.js (navigace v prohlížeči
    # a prefetch), Authorization. Metody kromě GET a HEAD nginx neukládá
    # sám (odeslání přihlášky lodi, serverové akce).
    proxy_cache_bypass $sezeni $http_rsc $http_authorization;
    proxy_no_cache     $sezeni $http_rsc $http_authorization;

    # Když stránka zestárne, vykresluje ji jen jeden požadavek; ostatní
    # mezitím dostanou předchozí verzi. Chyba webu se neukládá (platí jen
    # 200 a 404) a starou stránku za ni nginx nevydává — zastarání
    # zůstává nejvýš 10 s plus doba jednoho vykreslení.
    proxy_cache_lock on;
    proxy_cache_lock_timeout 10s;
    proxy_cache_use_stale updating;
    proxy_cache_background_update on;

    add_header X-Cache $upstream_cache_status always;
  }
}
